<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Project Reset App</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#0a0b0a">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky brand bar + tab row; one centred column for clients, wide grid for the coach. Single light look by choice: white base, the Project Reset logo's chartreuse green, black for weight. */
:root{
  color-scheme: light;
  --bg:#ffffff;
  --surface:#f6f8f5;
  --surface-2:#e9eee7;
  --line:#dfe5dc;
  --fg:#0a0b0a;
  --muted:#626a60;
  --lime:#a9e80c;
  --lime-dim:#a9e80c29;
  --pale:#f5fbe4;
  --done-bg:#e4e7e2;
  --done-fg:#8d948a;
  --g-track:#2e322b;
  --green-ink:#4f7300;
  --night:#0a0b0a;
  --on-night:#f2f5f1;
  --ink:#0a0b0a;
  --ok:#4f7300;
  --warn:#a86a00;
  --bad:#d4371f;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:Montserrat,"Helvetica Neue",Arial,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.55;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green-ink);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:760px;margin:0 auto}
.wide{max-width:1180px;margin:0 auto}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.display{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.92}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* Wordmark */
.mark{display:inline-flex;flex-direction:column;line-height:.8;font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;color:var(--fg)}
.mark span:last-child{background:var(--lime);color:var(--ink);padding:0 .12em;align-self:flex-start;margin-top:.04em}
.mark.sm{font-size:19px}
.mark.lg{font-size:clamp(54px,14vw,84px);transform:skew(-4deg)}
.logo{display:block;height:auto;max-width:100%}
.logo.sm{width:auto;height:40px}
.logo.lg{width:min(260px,72vw)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);box-shadow:0 1px 0 var(--lime)}
.top-in{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{background:var(--lime);color:var(--ink)}
.who{display:flex;align-items:center;gap:10px;font-size:13px}
/* phones: logo and account on the first row, the four tabs across the full width below */
@media (max-width:640px){.top-in{gap:8px 12px;padding-block:8px}.who{margin-left:auto}.tabs{order:3;flex-basis:100%;justify-content:space-between}.tab{flex:1;padding:8px 6px;text-align:center}}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:12px}
.link{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:4px}
.link:hover{color:var(--fg)}
.proto{font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);padding:3px 7px;border-radius:999px;font-weight:600}

main{padding-block:24px 64px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:11px 16px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--surface-2)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.4;cursor:default}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding-block:48px}
.test-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
.test-form .onb-err{grid-column:1/-1}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;font-weight:500;cursor:pointer}
.consent input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--green-ink)}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.busy{opacity:.6;pointer-events:none}
.onb-card{width:100%;max-width:640px;display:flex;flex-direction:column;gap:20px;padding:24px 0 60px}
.onb-sec{display:flex;flex-direction:column;gap:14px}
.onb-set{border:0;padding:0;margin:0}
.onb-set legend{font-size:13px;font-weight:600;margin-bottom:8px}
.req{color:var(--bad)}
.onb-chip{position:relative;cursor:pointer}
.onb-chip input,.onb-num input{position:absolute;opacity:0;pointer-events:none}
.onb-chip:has(input:checked){background:var(--lime);border-color:var(--lime);color:var(--ink)}
.onb-chip:has(input:focus-visible),.onb-num:has(input:focus-visible){outline:2px solid var(--green-ink);outline-offset:2px}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.onb-num{position:relative;cursor:pointer}
.onb-num span{display:grid;place-items:center;height:40px;border-radius:8px;background:var(--surface-2);font-weight:700;font-size:13px}
.onb-num:has(input:checked) span{background:var(--lime);color:var(--ink)}
.onb-err{color:var(--bad);font-weight:600;font-size:14px}
.onb-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;scroll-margin-top:16px}
.onb-tabs .phase-tab[aria-selected="true"]{background:var(--night);color:var(--lime)}
.onb-tabs .phase-tab[aria-selected="true"] small{color:var(--on-night);opacity:.75}
.pair-in{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field small.muted{font-weight:500;font-size:12px}
.photo-field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.photo-row{display:flex;align-items:center;gap:12px}
.photo-pv{width:64px;height:64px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--line);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--muted)}
.photo-pv img{width:100%;height:100%;object-fit:cover;display:block}
.upload{position:relative;cursor:pointer;min-height:44px}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.upload:has(input:focus-visible){outline:2px solid var(--green-ink);outline-offset:2px}
.as-q legend{display:flex;flex-direction:column;gap:3px;font-size:14px}
.as-q legend b{font-weight:800}
.as-qt{font-weight:500;color:var(--fg)}
.as-consider{margin:-2px 0 8px;font-size:12px}
.as-ends{display:flex;justify-content:space-between;gap:16px;font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.35}
.as-ends span:last-child{text-align:right}
.as-na{margin-top:8px;align-self:flex-start;display:inline-flex}
.ck-task{display:flex;flex-direction:column;gap:14px}
.ck-task .pb-num{background:var(--night);color:var(--lime)}
.ph-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.ph-thumb{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--fg);width:96px}
.ph-thumb img{width:96px;height:128px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;background:var(--surface-2)}
.ph-thumb small{font-size:11px;color:var(--muted);line-height:1.2}
.as-tbl{min-width:0}
.as-tbl td,.as-tbl th{padding:7px 10px}
.as-tbl .as-sec th,.as-tbl .as-sec td{background:var(--surface-2);font-weight:800}
.as-tbl .as-sec th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.delta{font-weight:800}
.delta.up{color:var(--green-ink)}
.delta.down{color:var(--bad)}
.onb-err:empty{display:none}
.wait-card{display:flex;flex-direction:column;gap:12px}
.wait-steps{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.wait-steps>div{display:flex;align-items:center;gap:12px;font-weight:600;color:var(--muted)}
.wait-steps>div.done{color:var(--fg)}
.wait-steps>div.now{color:var(--fg)}
.wait-steps .pb-num{width:32px;height:32px;font-size:16px;background:var(--surface-2);color:var(--muted)}
.wait-steps .done .pb-num{background:var(--night);color:var(--lime)}
.wait-steps .done .pb-num svg path{stroke:var(--lime)}
.wait-steps .now .pb-num{background:var(--lime);color:var(--ink)}
.signups{border:2px solid var(--lime)}
.signup-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.signup-row>div{display:flex;flex-direction:column;gap:2px}
.onb-ans{display:flex;flex-direction:column;gap:6px;padding:10px 0}
.onb-ans dl{margin:0;display:flex;flex-direction:column;gap:6px}
.onb-ans dl>div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;font-size:13px}
.onb-ans dt{color:var(--muted)}
.onb-ans dd{margin:0;font-weight:600;white-space:pre-wrap}
.target-set{display:flex;flex-direction:column;gap:14px;align-self:start}
.login-card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:22px}
.login-card form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.input:focus{border-color:var(--green-ink);outline:none}
.login-hero{background:var(--night);border-radius:18px;padding:28px 24px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 0 0 1px var(--night),0 18px 50px -18px var(--lime);background-image:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--lime) 22%,transparent),transparent 60%)}
.login-hero .mark span:first-child{color:var(--on-night)}
.login-hero p{color:var(--on-night);font-weight:600}
.demo-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.demo-row .btn.primary{grid-column:1/-1}
.welcome{background:var(--night);color:var(--on-night);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:8px;box-shadow:0 14px 40px -18px var(--lime)}
.welcome .eyebrow{color:var(--lime)}
.welcome .display{color:var(--lime)}
.demo-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px dashed var(--warn);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--warn)}
.demo-bar .chip{border-color:var(--warn);color:var(--warn);background:var(--bg)}
.note{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}

/* Cards and sections */
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.sec-title{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.02em}

/* Today header */
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:16px}
.dayno{font-size:clamp(64px,16vw,96px);color:var(--fg)}
.dayno small{font-size:.4em;color:var(--muted);margin-left:6px;font-style:italic}
.ring{flex:none;position:relative;width:96px;height:96px}
.ring svg{display:block}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:28px;font-weight:700;font-style:italic}
.daynav{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip:disabled{opacity:.35;cursor:default}
.theme{background:var(--night);color:var(--lime);box-shadow:inset 0 0 0 1px var(--night),0 10px 30px -12px var(--lime);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.theme .eyebrow{color:var(--on-night);opacity:.7}
.theme .display{font-size:clamp(30px,8vw,42px)}
.targets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.target{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.target b{font-family:var(--display);font-size:24px;font-weight:700;line-height:1}
.sticky{background:var(--surface);border-left:4px solid var(--lime);border-radius:0 var(--r) var(--r) 0;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.coachnote{border:1px solid var(--green-ink);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;background:var(--lime-dim)}

/* Task rows */
.tasks{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .lbl{flex:1;min-width:0;display:flex;flex-direction:column}
.row .lbl strong{font-weight:600}
.row .lbl small{color:var(--muted);font-size:12px}
.row.done .lbl strong{color:var(--fg)}
.tick{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:transparent;transition:background .15s,border-color .15s}
.row.done .tick{background:var(--lime);border-color:var(--lime)}
.tick svg{opacity:0}
.row.done .tick svg{opacity:1}
button.row{background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;color:inherit}
.row.stacked{flex-direction:column;align-items:stretch;gap:10px}
.row.stacked .top-line{display:flex;align-items:center;gap:14px}
.rating{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rating button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 0;font-weight:700;font-size:13px}
.rating button[aria-pressed="true"]{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.rating.arousal button.z-calm{background:color-mix(in srgb,#5b8def 10%,var(--surface-2))}
.rating.arousal button.z-centred{background:color-mix(in srgb,var(--lime) 14%,var(--surface-2))}
.rating.arousal button.z-wired{background:color-mix(in srgb,#e8743b 12%,var(--surface-2))}
.rating.arousal button[aria-pressed="true"]{background:var(--fg);color:#fff;border-color:var(--fg)}
.zones{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:4px}
.zone{display:flex;flex-direction:column;gap:1px;padding:6px 8px;border-radius:8px;font-size:11px;line-height:1.3;color:var(--muted);border:1px solid var(--line)}
.zone b{font-size:12px;color:var(--fg)}
.zone.on{border-color:var(--fg);color:var(--fg)}
.ctrl{width:150px;flex:none}
.ctrl.time{width:120px}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.badge.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.badge.miss{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);border-radius:99px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:18px;line-height:1}
.stepper b{font-family:var(--display);font-size:24px;min-width:58px;text-align:center}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button[aria-pressed="true"]{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.upload{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
textarea.input{min-height:84px;resize:vertical}
.more{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.more button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.more button:hover{border-color:var(--green-ink)}
.more small{color:var(--muted);font-size:12px}

/* Programme content */
.hero-p{display:flex;flex-direction:column;gap:10px;padding-block:8px 6px}
.hero-p .display{font-size:clamp(44px,11vw,72px)}
.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.acc summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.acc summary::-webkit-details-marker{display:none}
.acc summary h3{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.02em}
.acc summary .plus{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;transition:transform .2s}
.acc[open] summary .plus{transform:rotate(45deg);border-color:var(--lime);background:var(--lime);color:var(--ink)}
.acc .body{padding:0 18px 20px;display:flex;flex-direction:column;gap:12px;max-width:68ch}
.acc .body h4{margin:6px 0 0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--green-ink)}
.acc .body ul,.acc .body ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.acc .body blockquote{margin:0;padding:12px 14px;border-left:4px solid var(--lime);background:var(--surface);border-radius:0 10px 10px 0;font-weight:600}
.reset-letters{display:grid;gap:8px}
.reset-letters div{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.reset-letters b{font-family:var(--display);font-style:italic;font-size:40px;line-height:.9;color:var(--green-ink)}
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px}
.tool b{font-family:var(--display);font-size:22px;text-transform:uppercase;font-weight:700}
.tool small{color:var(--muted)}

/* Progress */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat .cell{aspect-ratio:1;max-width:100%;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.heat .cell.l1{background:color-mix(in srgb,var(--lime) 18%,var(--surface));color:var(--fg)}
.heat .cell.l2{background:color-mix(in srgb,var(--lime) 45%,var(--surface));color:var(--fg)}
.heat .cell.l3{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.heat .cell.future{background:transparent;border-style:dashed;opacity:.5}
.heat .cell.today{outline:2px solid var(--fg);outline-offset:1px}
.heat .cell.sel{outline:2px solid var(--green-ink);outline-offset:2px}
button.cell{cursor:pointer}
.heat-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:11px;color:var(--muted);text-align:center;margin-bottom:6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
/* non negotiables */
.nn-group{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.nn-group:first-of-type{border-top:0;padding-top:4px}
.nn-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nn-head .pl{font-family:var(--display);font-style:italic;font-weight:800;font-size:30px;line-height:.8;color:var(--green-ink);width:20px}
.nn-head b{font-family:var(--display);font-size:20px;text-transform:uppercase;font-weight:700;letter-spacing:.02em}
.nn-head .num{color:var(--muted);font-size:13px}
.nn-head .all{margin-left:auto;font-size:12px;padding:5px 10px}
.nn-chips{display:flex;flex-wrap:wrap;gap:6px}
.nn-chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--fg)}
.nn-chip[aria-pressed="true"],.nn-chip.kept{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.nn-chip.auto{border-style:dashed;cursor:help;background:var(--surface)}
.nn-chip.auto.kept{border-style:solid;background:var(--lime-dim);border-color:var(--lime)}
.nn-chip.miss{color:var(--muted)}
.nn-chip small{font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.65;font-weight:700}
.nn-week{display:flex;flex-direction:column;gap:6px;font-size:13px;background:var(--surface);border-radius:10px;padding:10px 12px}
.nn-week .top-line{display:flex;justify-content:space-between;gap:10px}
.nn-key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.nn-key .nn-chip{padding:2px 8px;font-size:11px;pointer-events:none}
.nn-tags{padding-left:42px;gap:5px}
.nn-tag{padding:4px 10px;font-size:12px;background:var(--bg);border-style:dashed}
.nn-tag[aria-pressed="true"]{border-style:solid}
.row-btn{display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;width:100%;text-align:left;color:inherit;min-width:0}
.dt-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dt-opt{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px}
.dt-opt b{font-family:var(--display);font-size:24px;text-transform:uppercase;font-style:italic;font-weight:800;line-height:1}
.dt-opt small{color:var(--muted);font-size:12px}
.dt-opt[aria-pressed="true"]{background:var(--night);border-color:var(--night);color:var(--lime);box-shadow:0 8px 24px -12px var(--lime)}
.dt-opt[aria-pressed="true"] small{color:var(--on-night);opacity:.75}
.daytype:has(.dt-opt[aria-pressed="true"]) .dt-opt:not([aria-pressed="true"]) b{font-size:18px}
.ringwrap{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.nnsum{font-size:11px;color:var(--muted);text-align:center;line-height:1.2;max-width:110px}
.nnsum b{display:block;font-family:var(--display);font-size:20px;color:var(--fg)}
.pillar-sum{display:flex;gap:14px;align-items:center;min-width:0}
.pillar-sum .pl{font-family:var(--display);font-style:italic;font-weight:800;font-size:48px;line-height:.8;color:var(--green-ink);flex:none}
.pillar-sum small{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:2px}
.nn-item{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.nn-item-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.how{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.how.auto{background:var(--lime-dim);color:var(--green-ink)}
.how.tap{background:var(--fg);color:var(--bg)}
.hview{display:flex;gap:6px;margin-bottom:10px}
.hview button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.habit .pl{color:var(--green-ink);font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-right:2px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile b{font-family:var(--display);font-size:36px;line-height:1;font-weight:700}
.tile small{color:var(--muted);font-size:12px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.keyrow{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.keyrow i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

/* Coach */
.coach-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:13px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface)}
th button{background:none;border:0;padding:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit}
th button[data-active="true"]{color:var(--green-ink)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.mini{display:inline-flex;gap:2px;vertical-align:middle}
.mini i{width:8px;height:18px;border-radius:2px;background:var(--surface-2)}
.mini i.l1{background:color-mix(in srgb,var(--lime) 25%,var(--surface-2))}
.mini i.l2{background:color-mix(in srgb,var(--lime) 55%,var(--surface-2))}
.mini i.l3{background:var(--lime)}
.habit{display:grid;grid-template-columns:150px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.habit .bar i.low{background:var(--bad)}
.habit .bar i.mid{background:var(--warn)}
.detail-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.detail-head .display{font-size:clamp(40px,9vw,64px)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.log-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}
.log-list div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;min-width:0}
.log-list div span:last-child{text-align:right;overflow-wrap:anywhere}
.log-list .miss span:last-child{color:var(--muted)}
.weeks-tbl table{min-width:820px}
.weeks-tbl td{vertical-align:top}
.weeks-tbl .input{padding:8px 10px;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--lime);color:var(--ink);font-weight:700;padding:10px 16px;border-radius:999px;font-size:13px;z-index:20}

/* phases + steps + day list */
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:4}
.phase-tab{border:0;background:none;border-radius:10px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:700;font-size:14px;color:var(--fg)}
.phase-tab small{font-size:11px;color:var(--muted);font-weight:600}
.phase-tab[aria-current="page"]{background:var(--night);color:var(--lime)}
.phase-tab[aria-current="page"] small{color:var(--on-night);opacity:.75}
.phase-tab.complete:not([aria-current="page"]) small{color:var(--green-ink)}
.goal{display:flex;flex-direction:column;gap:4px}
.steps-list{display:flex;flex-direction:column;gap:12px}
.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.step.locked{opacity:.55}
.step.current{border-color:var(--green-ink);box-shadow:0 0 0 3px var(--lime-dim);background:var(--bg)}
.step-num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-style:italic;font-weight:800;font-size:22px;background:var(--surface-2)}
.step.current .step-num{background:var(--night);color:var(--lime)}
.step.done .step-num{background:var(--lime)}
.step-body{display:flex;flex-direction:column;gap:12px;min-width:0}
.step-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step-head h3{font-family:var(--display);font-size:24px;text-transform:uppercase;font-weight:700;line-height:1}
.draft{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--warn);border:1px dashed currentColor;border-radius:999px;padding:1px 7px}
.ask{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;min-width:0}
.step-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stamp{font-weight:700;font-variant-numeric:tabular-nums;background:var(--lime-dim);color:var(--green-ink);padding:3px 9px;border-radius:999px;font-size:12px;white-space:nowrap}
.direction{background:var(--night);color:var(--on-night);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.direction .eyebrow{color:var(--lime)}
.direction small{opacity:.8}
.locked-day{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-block:32px}
.lockbig{width:52px;height:52px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.lockbig svg{width:22px;height:22px}
.items{display:flex;flex-direction:column}
.item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item-tick{background:none;border:0;padding:0;flex:none}
.item-tick .tick{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center}
.item-tick .tick svg{opacity:0}
.item.done .item-tick .tick{background:var(--lime);border-color:var(--lime)}
.item.done .item-tick .tick svg{opacity:1}
.item-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.item-title{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600;padding-top:3px}
.item-title>span:first-child{overflow-wrap:anywhere}
.kind{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.fu{background:var(--night);color:var(--on-night);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;margin-top:4px}
.fu .chip{background:var(--bg);color:var(--fg);border-color:var(--bg)}
.fu .chip[data-val="1"]{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.x{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px}
.x:hover{color:var(--bad)}
.composer{display:flex;gap:8px;margin-top:10px}
.composer .input{flex:1}
.chip.add{background:var(--bg)}
.senses{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sense{border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;font-size:12px;font-weight:600;background:var(--bg)}
.sense b{font-family:var(--display);font-size:20px;line-height:1;color:var(--muted)}
.sense.on{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.sense.on b{color:var(--ink)}
.nn-item{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.log-phase{display:flex;flex-direction:column;margin-top:14px}
.log-phase:first-of-type{margin-top:4px}
.log-phase h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--green-ink);margin:0 0 4px}
.lp-row{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:3px}
.lp-top{display:flex;justify-content:space-between;gap:12px}
.lp-row.miss .lp-top{color:var(--muted)}
.lp-ans{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px}
.lp-ans span{overflow-wrap:anywhere}
.kindrow{padding:8px 0;border-top:1px solid var(--line)}
.kindrow:first-of-type{border-top:0}
.kind-h{display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px}
.nextbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border:2px solid var(--night);border-radius:var(--r);padding:16px 18px;background:var(--bg)}
.nextbar p{color:var(--muted);font-size:13px}
.nextbar .btn{flex:none}
.scorecard{background:var(--night);color:var(--on-night);border-radius:18px;padding:22px 22px 24px;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 50px -18px var(--lime);background-image:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--lime) 18%,transparent),transparent 60%)}
.scorecard .eyebrow{color:var(--lime)}
.sc-big{display:flex;align-items:flex-end;gap:14px}
.sc-big b{font-family:var(--display);font-style:italic;font-weight:800;font-size:clamp(96px,26vw,140px);line-height:.8;color:var(--lime)}
.sc-big span{font-family:var(--display);font-size:28px;text-transform:uppercase;font-weight:700;line-height:1;padding-bottom:6px}
.sc-big small{font-family:var(--body);font-size:13px;text-transform:none;font-weight:500;opacity:.75}
.sc-diff{align-self:flex-start;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--on-night) 12%,transparent)}
.sc-diff.up{color:var(--lime)}
.sc-parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sc-part{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.sc-part span{font-size:12px;color:var(--muted);font-weight:600}
.sc-part b{font-family:var(--display);font-size:30px;line-height:1}
.sc-part small{font-size:16px;color:var(--muted)}
.tile small+small{margin-top:2px}
.sc-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
.sc-tiles .tile b{font-size:clamp(24px,7vw,36px)}
.sc-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sc-num{display:flex;flex-direction:column;gap:3px;align-items:flex-start;font-size:12px}
.sc-num b{font-family:var(--display);font-size:26px;line-height:1}
.brain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.notice{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.notice-q{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green-ink)}
.notice .chip{padding:4px 10px;font-size:12px;background:var(--bg)}
.notice .input{padding:8px 10px;font-size:13px}
.item .notice{margin-top:4px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.tl li:first-child{border-top:0}
.tl-t{font-weight:700;color:var(--green-ink)}
.tl-b{display:flex;flex-direction:column;gap:3px;min-width:0}
.tl-n{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.feel{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--lime-dim);color:var(--green-ink)}
.tl-n q{font-style:italic;color:var(--fg);overflow-wrap:anywhere}
details.raw{margin-top:12px}
details.raw summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--muted)}
.review,.todo-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:2px 12px}
.todo-list:empty{display:none}
.rv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-weight:500}
.rv:first-child{border-top:0}
.rv.done span:first-child{color:var(--green-ink)}
.rv .chip{padding:4px 10px;font-size:12px;flex:none}
.item.meal .input{padding:8px 10px;font-size:14px}
.item.meal .meal-tags .chip{padding:4px 10px;font-size:12px}
details.moreopts{margin-top:12px}
details.moreopts summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--green-ink)}
@media (max-width:560px){.brain{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pblock{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 76px)}
.pblock.open{display:flex;flex-direction:column;gap:14px;background:var(--pale);border:2px solid var(--lime);border-radius:22px;padding:18px;box-shadow:0 14px 40px -24px var(--green-ink)}
.pblock.open.done{background:var(--surface);border-color:var(--line);box-shadow:none}
.pblock.open .card,.pblock.open .step:not(.current),.pblock.open .nextbar{background:var(--bg)}
.pblock.open .step.locked{background:color-mix(in srgb,var(--bg) 70%,var(--pale))}
.pb-head{display:flex;align-items:flex-start;gap:14px}
.pb-head>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pb-head .eyebrow{color:var(--green-ink)}
.pb-title{font-size:clamp(40px,11vw,56px);line-height:.9}
.pb-num{width:48px;height:48px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-style:italic;font-weight:800;font-size:26px;background:var(--night);color:var(--lime)}
.pblock.done .pb-num{background:var(--lime);color:var(--ink)}
.pb-sum{display:flex;align-items:center;gap:18px;width:100%;min-height:120px;text-align:left;border-radius:22px;padding:22px 20px}
.pb-sum:disabled{cursor:default}
.pblock.done .pb-sum{background:var(--done-bg);border:2px solid var(--done-bg);color:var(--done-fg)}
.pblock.done .pb-sum:hover{border-color:var(--done-fg)}
.pblock.done .pb-sum .pb-num{width:68px;height:68px;background:var(--lime);color:var(--ink)}
.pblock.done .pb-sum .pb-num svg{width:36px;height:36px}
.pblock.upcoming .pb-sum,.pblock.skipped .pb-sum{background:var(--bg);border:2px dashed var(--line);color:var(--muted);opacity:.55}
.pblock.upcoming .pb-num,.pblock.skipped .pb-num{width:68px;height:68px;background:var(--surface);color:var(--muted)}
.pblock.upcoming .pb-num svg{width:24px;height:24px}
.pairs{display:flex;flex-direction:column;gap:10px}
.plan-slots{display:flex;flex-direction:column;gap:8px}
.role{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--night);color:var(--lime);padding:2px 7px;border-radius:999px;vertical-align:2px;margin-left:4px}
.train-place{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:600}
.train-place .chip{padding:4px 10px;font-size:12px}
.train-place small{font-size:12px;font-weight:500}
.plan-train{display:flex;align-items:center;gap:12px;padding:8px 12px;border:2px solid var(--night);border-radius:12px;background:var(--night);color:var(--on-night);font-size:13px}
.plan-train .plan-n{background:var(--lime);color:var(--ink);font-style:normal;font-size:14px}
.train-row{border:2px solid var(--night)}
.train-row .pi{background:var(--night);color:var(--on-night)}
.train-row .muted{color:var(--on-night);opacity:.7}
.train-row .kind{color:var(--lime)}
.train-row .item-tick .tick{border-color:var(--on-night)}
.train-row .stamp{background:var(--lime);color:var(--ink)}
.plan-slot{border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.plan-slot.filled{border-color:color-mix(in srgb,var(--lime) 60%,var(--line))}

(function(){

otations", "Balance-board exercises"]], ["intero", "Interoception", "Internal body awareness", "Signals from within the body.", ["Noticing your heartbeat", "Observing your breathing", "Recognising hunger or fullness", "Recognising thirst", "Noticing internal temperature", "Body scanning", "Recognising muscle fatigue", "Noticing digestive sensations", "Recognising tension or relaxation", "Identifying when you feel energised or exhausted"]], ["taste", "Taste", "Gustatory system", "Flavour, taste intensity & food related sensory experience.", ["Sour lemon or lime", "Sweet fruit", "Bitter foods or drinks", "Salty foods", "Umami-rich foods", "Eating something crunchy and flavourful", "Trying unfamiliar flavours", "Mindful tasting", "Savouring a favourite meal", "Comparing contrasting flavours"]]];

  const avg7=Math.round(avg(x=>x.pct)),pts7=avg(x=>x.sc.pts);
  const morn7=Math.round(avg(x=>x.sc.m===ML?100:0)),eve7=Math.round(avg(x=>x.sc.e===evLen(x.log)?100:0));
  const fuA=rows.reduce((a,x)=>a+x.sc.fuN,0),fuY=rows.reduce((a,x)=>a+x.sc.fuYes,0); // water with meals
  const proc7=fuA?Math.round(fuY/fuA*100):null,senses7=avg(x=>x.sc.senses.size);
  let streak=0;const todayRow=days[days.length-1];
  if(todayRow.pct>=70)streak++;
  for(let i=past.length-1;i>=0;i--){if(past[i].pct>=70)streak++;else break}
  let lastLog=null;for(let i=days.length-1;i>=0;i--){if(days[i].any){lastLog=days[i];break}}
  const since=lastLog?today-lastLog.d:today;
  const numAvg=k=>{const v=rows.map(x=>Number(x.log[k])).filter(n=>n>0);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
  let status="ok";if(today===0)status="new";else if(since>=2||avg7<45)status="bad";else if(avg7<70)status="warn";
  return{c,days,rows,today,todayRow,avg7,pts7,morn7,eve7,proc7,senses7,streak,since,status,
    steps7:numAvg("steps"),protein7:numAvg("protein"),am7:numAvg("am_state"),pm7:numAvg("pm_state")};
}

async function shrink(file,max=1600){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("That file couldn't be read. Try a JPG or PNG photo."));i.src=url});
    const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),cv=document.createElement("canvas");
    cv.width=Math.round(img.naturalWidth*sc);cv.height=Math.round(img.naturalHeight*sc);
    const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height);g.drawImage(img,0,0,cv.width,cv.height);
    let q=.82,d=cv.toDataURL("image/jpeg",q);while(d.length>1800000&&q>.35){q-=.12;d=cv.toDataURL("image/jpeg",q)}
    return d;
  }finally{URL.revokeObjectURL(url)}
}

}

const avgOf=arr=>{const n=arr.filter(v=>typeof v==="number");return n.length?n.reduce((x,y)=>x+y,0)/n.length:null};
function assessTable(c){
  const A=assessOf(c.id),slots=AS_SLOTS.filter(([s])=>A[s]);

  const delta=(a,b)=>{if(typeof a!=="number"||typeof b!=="number"||slots.length<2)return'<span class="muted">–</span>';const d=Math.round((b-a)*10)/10;return `<span class="delta ${d>0?"up":d<0?"down":""}">${d>0?"+":""}${d}</span>`};

}

function chart({n,series,max,target,fmt,kind,labelEvery}){
  const W=640,H=190,pl=44,pr=12,pt=12,pb=26,iw=W-pl-pr,ih=H-pt-pb,bw=iw/Math.max(n,1);
  const xc=i=>pl+bw*(i+.5),y=v=>pt+ih-(v/max)*ih;
  const ticks=[0,max/2,max];
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  ticks.forEach(t=>{s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end">${fmt(t)}</text>`});
  for(let i=0;i<n;i++){if(i===0||(i+1)%(labelEvery||7)===0||i===n-1)s+=`<text x="${xc(i)}" y="${H-8}" text-anchor="middle">D${i+1}</text>`}
  if(target!=null)s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(target)}" y2="${y(target)}" stroke="var(--fg)" stroke-dasharray="4 4" stroke-width="1" opacity=".6"/><text x="${W-pr}" y="${y(target)-5}" text-anchor="end" style="fill:var(--fg)">Target</text>`;
  series.forEach(se=>{
    if(kind==="bar"){
      se.values.forEach((v,i)=>{if(v==null)return;const h=Math.max(1,(Math.min(v,max)/max)*ih);s+=`<rect x="${xc(i)-bw*.32}" y="${pt+ih-h}" width="${bw*.64}" height="${h}" rx="3" fill="${target!=null&&v<target?"var(--surface-2)":se.color}" stroke="var(--green-ink)" stroke-width="1"><title>Day ${i+1}: ${fmt(v)}</title></rect>`});
    }else{
      const pts=se.values.map((v,i)=>v==null?null:[xc(i),y(Math.min(v,max))]);
      const segs=[];let cur=[];pts.forEach(p=>{if(p)cur.push(p);else if(cur.length){segs.push(cur);cur=[]}});if(cur.length)segs.push(cur);
      segs.forEach(sg=>{
        if(se.area&&sg.length>1)s+=`<path d="M${sg[0][0]},${pt+ih} L${sg.map(p=>p.join(",")).join(" L")} L${sg[sg.length-1][0]},${pt+ih} Z" fill="${se.color}" opacity=".14"/>`;
        s+=`<polyline points="${sg.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${se.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
      });
      pts.forEach((p,i)=>{if(p)s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4.5:2.5}" fill="${se.color}"><title>Day ${i+1}: ${fmt(se.values[i])}</title></circle>`});
    }
  });
  return s+"</svg>";
}
function heatmap(st,{clickable,sel}={}){
  const cells=[];
  for(let d=1;d<=PROGRAMME_DAYS;d++){
    const row=st.days[d-1],future=d>st.today;
    const cls=`cell ${future?"future":lvl(row?row.pct:0)}${d===st.today?" today":""}${sel===d?" sel":""}`;
    const label=future?`Day ${d}, upcoming`:`Day ${d}, ${row.pct}% done`;
    cells.push(clickable&&!future?`<button class="${cls}" data-hday="${d}" aria-label="${label}" title="${label}">${d}</button>`:`<div class="${cls}" title="${label}">${d}</div>`);
  }
  const start=clientStart(st.c);
  const heads=Array.from({length:7},(_,i)=>addDays(start,i).toLocaleDateString("en-GB",{weekday:"short"}));
  return `<div class="heat-head">${heads.map(h=>`<span>${h}</span>`).join("")}</div><div class="heat">${cells.join("")}</div>
  <div class="legend" style="margin-top:10px"><span><i style="background:var(--lime)"></i>70%+</span><span><i style="background:color-mix(in srgb,var(--lime) 45%,var(--surface))"></i>40 to 69%</span><span><i style="background:color-mix(in srgb,var(--lime) 18%,var(--surface))"></i>Under 40%</span><span><i></i>Nothing logged</span></div>`;
}

function trendCharts(st){
  const n=st.today;
  const pts=st.days.map(x=>x.sc.pts),steps=st.days.map(x=>x.log.steps?Number(x.log.steps):null);
  const am=st.days.map(x=>x.log.am_state||null),pm=st.days.map(x=>x.log.pm_state||null);
  return `<div class="two">
    <section class="card"><div class="sec-head"><h3 class="sec-title" style="font-size:20px">Points per day</h3></div>${chart({n,kind:"bar",series:[{values:pts,color:"var(--lime)"}],max:Math.max(10,...pts),fmt:v=>String(Math.round(v))})}</section>
    <section class="card"><div class="sec-head"><h3 class="sec-title" style="font-size:20px">Steps</h3></div>${chart({n,kind:"bar",series:[{values:steps,color:"var(--lime)"}],max:Math.max(16000,...steps.filter(Boolean)),target:weekOf(n).steps,fmt:v=>v>=1000?Math.round(v/1000)+"k":String(Math.round(v))})}</section>
    <section class="card"><div class="sec-head"><h3 class="sec-title" style="font-size:20px">Arousal, AM and PM</h3><small class="muted" style="font-size:11px">1 to 3 Calm · 4 to 6 Centred · 7 to 10 Wired</small><div class="keyrow"><span><i style="background:var(--green-ink)"></i>AM</span><span><i style="background:var(--fg)"></i>PM</span></div></div>${chart({n,series:[{values:am,color:"var(--green-ink)"},{values:pm,color:"var(--fg)"}],max:10,fmt:v=>String(Math.round(v))})}</section>
  </div>`;
}

root.addEventListener("keydown",e=>{if(e.target.id==="mpInput"&&e.key==="Enter"){e.preventDefault();const bt=root.querySelector("[data-mpadd]");if(bt)bt.click();return}if(e.target.id==="tmrInput"&&e.key==="Enter"){e.preventDefault();const bt=root.querySelector("[data-tadd]");if(bt)bt.click();return}const tr=e.target.closest("tr[data-client]");if(tr&&(e.key==="Enter"||e.key===" ")){e.preventDefault();tr.click()}});

  clearTimeout(timers[k]);timers[k]=setTimeout(()=>edit(k,v),300);

root.addEventListener("change",e=>{

    shrink(file).then(d=>{PHOTO_BUF[pk]=d;if(pv)pv.innerHTML=`<img src="${d}" alt="">`;if(lab)lab.textContent="Change photo"}).catch(x=>{if(lab)lab.textContent="Add photo";toast(x.message)});return}

  const fk=e.target.dataset.file;if(fk){const f=e.target.files&&e.target.files[0];if(f){edit(fk,f.name);render()}return}
  const k=e.target.dataset.input;if(!k)return;
  let v=e.target.value;if(e.target.type==="number")v=v===""?"":Number(v);
  if(k==="tmr_train_time")edit("tmr_train_after","");
  if(k==="train_time")edit("train_after","");

root.addEventListener("focusout",e=>{
  // leaving the last of a group of boxes: now it's safe to redraw (a tap on a button redraws anyway)
