<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Project Reset App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky brand bar + tab row; one centred column for clients, wide grid for the coach. Single light look by choice: white base, GrowLikeVines neon green, black for weight. */
:root{
  color-scheme: light;
  --bg:#ffffff;
  --surface:#f6f8f5;
  --surface-2:#e9eee7;
  --line:#dfe5dc;
  --fg:#0a0b0a;
  --muted:#626a60;
  --lime:#39e81f;
  --lime-dim:#39e81f1f;
  --green-ink:#14861a;
  --night:#0a0b0a;
  --on-night:#f2f5f1;
  --ink:#0a0b0a;
  --ok:#14861a;
  --warn:#a86a00;
  --bad:#d4371f;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:Montserrat,"Helvetica Neue",Arial,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.55;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green-ink);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:760px;margin:0 auto}
.wide{max-width:1180px;margin:0 auto}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.display{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.92}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* Wordmark */
.mark{display:inline-flex;flex-direction:column;line-height:.8;font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;color:var(--fg)}
.mark span:last-child{background:var(--lime);color:var(--ink);padding:0 .12em;align-self:flex-start;margin-top:.04em}
.mark.sm{font-size:19px}
.mark.lg{font-size:clamp(54px,14vw,84px);transform:skew(-4deg)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);box-shadow:0 1px 0 var(--lime)}
.top-in{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{background:var(--lime);color:var(--ink)}
.who{display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:12px}
.link{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:4px}
.link:hover{color:var(--fg)}
.proto{font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);padding:3px 7px;border-radius:999px;font-weight:600}

main{padding-block:24px 64px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:11px 16px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--surface-2)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.4;cursor:default}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding-block:48px}
.login-card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:22px}
.login-card form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.input:focus{border-color:var(--green-ink);outline:none}
.login-hero{background:var(--night);border-radius:18px;padding:28px 24px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 0 0 1px var(--night),0 18px 50px -18px var(--lime);background-image:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--lime) 22%,transparent),transparent 60%)}
.login-hero .mark span:first-child{color:var(--on-night)}
.login-hero p{color:var(--on-night);font-weight:600}
.demo-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}

/* Cards and sections */
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.sec-title{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.02em}

/* Today header */
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:16px}
.dayno{font-size:clamp(64px,16vw,96px);color:var(--fg)}
.dayno small{font-size:.4em;color:var(--muted);margin-left:6px;font-style:italic}
.ring{flex:none;position:relative;width:96px;height:96px}
.ring svg{display:block}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:28px;font-weight:700;font-style:italic}
.daynav{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip:disabled{opacity:.35;cursor:default}
.theme{background:var(--night);color:var(--lime);box-shadow:inset 0 0 0 1px var(--night),0 10px 30px -12px var(--lime);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.theme .eyebrow{color:var(--on-night);opacity:.7}
.theme .display{font-size:clamp(30px,8vw,42px)}
.targets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.target{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.target b{font-family:var(--display);font-size:24px;font-weight:700;line-height:1}
.sticky{background:var(--surface);border-left:4px solid var(--lime);border-radius:0 var(--r) var(--r) 0;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.coachnote{border:1px solid var(--green-ink);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;background:var(--lime-dim)}

/* Task rows */
.tasks{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .lbl{flex:1;min-width:0;display:flex;flex-direction:column}
.row .lbl strong{font-weight:600}
.row .lbl small{color:var(--muted);font-size:12px}
.row.done .lbl strong{color:var(--fg)}
.tick{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:transparent;transition:background .15s,border-color .15s}
.row.done .tick{background:var(--lime);border-color:var(--lime)}
.tick svg{opacity:0}
.row.done .tick svg{opacity:1}
button.row{background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;color:inherit}
.row.stacked{flex-direction:column;align-items:stretch;gap:10px}
.row.stacked .top-line{display:flex;align-items:center;gap:14px}
.rating{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rating button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 0;font-weight:700;font-size:13px}
.rating button[aria-pressed="true"]{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.ctrl{width:150px;flex:none}
.ctrl.time{width:120px}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.badge.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.badge.miss{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);border-radius:99px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:18px;line-height:1}
.stepper b{font-family:var(--display);font-size:24px;min-width:58px;text-align:center}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button[aria-pressed="true"]{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.upload{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
textarea.input{min-height:84px;resize:vertical}
.more{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.more button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.more button:hover{border-color:var(--green-ink)}
.more small{color:var(--muted);font-size:12px}

/* Programme content */
.hero-p{display:flex;flex-direction:column;gap:10px;padding-block:8px 6px}
.hero-p .display{font-size:clamp(44px,11vw,72px)}
.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.acc summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.acc summary::-webkit-details-marker{display:none}
.acc summary h3{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.02em}
.acc summary .plus{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;transition:transform .2s}
.acc[open] summary .plus{transform:rotate(45deg);border-color:var(--lime);background:var(--lime);color:var(--ink)}
.acc .body{padding:0 18px 20px;display:flex;flex-direction:column;gap:12px;max-width:68ch}
.acc .body h4{margin:6px 0 0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--green-ink)}
.acc .body ul,.acc .body ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.acc .body blockquote{margin:0;padding:12px 14px;border-left:4px solid var(--lime);background:var(--surface);border-radius:0 10px 10px 0;font-weight:600}
.reset-letters{display:grid;gap:8px}
.reset-letters div{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.reset-letters b{font-family:var(--display);font-style:italic;font-size:40px;line-height:.9;color:var(--green-ink)}
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px}
.tool b{font-family:var(--display);font-size:22px;text-transform:uppercase;font-weight:700}
.tool small{color:var(--muted)}

/* Progress */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat .cell{aspect-ratio:1;max-width:100%;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.heat .cell.l1{background:color-mix(in srgb,var(--lime) 18%,var(--surface));color:var(--fg)}
.heat .cell.l2{background:color-mix(in srgb,var(--lime) 45%,var(--surface));color:var(--fg)}
.heat .cell.l3{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.heat .cell.future{background:transparent;border-style:dashed;opacity:.5}
.heat .cell.today{outline:2px solid var(--fg);outline-offset:1px}
.heat .cell.sel{outline:2px solid var(--green-ink);outline-offset:2px}
button.cell{cursor:pointer}
.heat-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:11px;color:var(--muted);text-align:center;margin-bottom:6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
/* non negotiables */
.nn-group{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.nn-group:first-of-type{border-top:0;padding-top:4px}
.nn-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nn-head .pl{font-family:var(--display);font-style:italic;font-weight:800;font-size:30px;line-height:.8;color:var(--green-ink);width:20px}
.nn-head b{font-family:var(--display);font-size:20px;text-transform:uppercase;font-weight:700;letter-spacing:.02em}
.nn-head .num{color:var(--muted);font-size:13px}
.nn-head .all{margin-left:auto;font-size:12px;padding:5px 10px}
.nn-chips{display:flex;flex-wrap:wrap;gap:6px}
.nn-chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--fg)}
.nn-chip[aria-pressed="true"],.nn-chip.kept{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.nn-chip.auto{border-style:dashed;cursor:help;background:var(--surface)}
.nn-chip.auto.kept{border-style:solid;background:var(--lime-dim);border-color:var(--lime)}
.nn-chip.miss{color:var(--muted)}
.nn-chip small{font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.65;font-weight:700}
.nn-week{display:flex;flex-direction:column;gap:6px;font-size:13px;background:var(--surface);border-radius:10px;padding:10px 12px}
.nn-week .top-line{display:flex;justify-content:space-between;gap:10px}
.nn-key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.nn-key .nn-chip{padding:2px 8px;font-size:11px;pointer-events:none}
.nn-tags{padding-left:42px;gap:5px}
.nn-tag{padding:4px 10px;font-size:12px;background:var(--bg);border-style:dashed}
.nn-tag[aria-pressed="true"]{border-style:solid}
.row-btn{display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;width:100%;text-align:left;color:inherit;min-width:0}
.dt-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dt-opt{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px}
.dt-opt b{font-family:var(--display);font-size:24px;text-transform:uppercase;font-style:italic;font-weight:800;line-height:1}
.dt-opt small{color:var(--muted);font-size:12px}
.dt-opt[aria-pressed="true"]{background:var(--night);border-color:var(--night);color:var(--lime);box-shadow:0 8px 24px -12px var(--lime)}
.dt-opt[aria-pressed="true"] small{color:var(--on-night);opacity:.75}
.daytype:has(.dt-opt[aria-pressed="true"]) .dt-opt:not([aria-pressed="true"]) b{font-size:18px}
.ringwrap{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.nnsum{font-size:11px;color:var(--muted);text-align:center;line-height:1.2;max-width:110px}
.nnsum b{display:block;font-family:var(--display);font-size:20px;color:var(--fg)}
.pillar-sum{display:flex;gap:14px;align-items:center;min-width:0}
.pillar-sum .pl{font-family:var(--display);font-style:italic;font-weight:800;font-size:48px;line-height:.8;color:var(--green-ink);flex:none}
.pillar-sum small{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:2px}
.nn-item{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.nn-item-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.how{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.how.auto{background:var(--lime-dim);color:var(--green-ink)}
.how.tap{background:var(--fg);color:var(--bg)}
.hview{display:flex;gap:6px;margin-bottom:10px}
.hview button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.habit .pl{color:var(--green-ink);font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-right:2px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile b{font-family:var(--display);font-size:36px;line-height:1;font-weight:700}
.tile small{color:var(--muted);font-size:12px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.keyrow{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.keyrow i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

/* Coach */
.coach-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:13px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface)}
th button{background:none;border:0;padding:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit}
th button[data-active="true"]{color:var(--green-ink)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.mini{display:inline-flex;gap:2px;vertical-align:middle}
.mini i{width:8px;height:18px;border-radius:2px;background:var(--surface-2)}
.mini i.l1{background:color-mix(in srgb,var(--lime) 25%,var(--surface-2))}
.mini i.l2{background:color-mix(in srgb,var(--lime) 55%,var(--surface-2))}
.mini i.l3{background:var(--lime)}
.habit{display:grid;grid-template-columns:150px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.habit .bar i.low{background:var(--bad)}
.habit .bar i.mid{background:var(--warn)}
.detail-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.detail-head .display{font-size:clamp(40px,9vw,64px)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.log-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}
.log-list div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;min-width:0}
.log-list div span:last-child{text-align:right;overflow-wrap:anywhere}
.log-list .miss span:last-child{color:var(--muted)}
.weeks-tbl table{min-width:820px}
.weeks-tbl td{vertical-align:top}

<body>
<div id="root"></div>

<script>
(function(){
"use strict";

/* ---------- storage (per browser, demo only) ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const K={session:"pr1_session",edits:"pr1_edits",notes:"pr1_notes",weeks:"pr1_weeks"};

/* ---------- dates ---------- */
const DAY=86400000;
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const diffDays=(a,b)=>Math.round((b-a)/DAY);
const NOW=new Date();
const TODAY=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
const COHORT=addDays(TODAY,-((TODAY.getDay()+6)%7)-7); // Monday of last week, so the demo is always mid-programme
const fmtLong=d=>d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
const fmtShort=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const mins=t=>{if(!t)return null;const[h,m]=t.split(":").map(Number);return h*60+m};
const hhmm=m=>{m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+":"+pad(m%60)};
const PROGRAMME_DAYS=28;

/* ---------- programme config ---------- */
const DEFAULT_WEEKS=[
  {theme:"Build the baseline",note:"Same wake time, same bed time, every day this week. Your nervous system trusts what it can predict. Give it something to predict.",wake:"07:00",bed:"22:00",water:6,steps:10000},
  {theme:"Make it the default",note:"Stress, poor sleep & poor recovery all lower the oxygen reaching your cells. Less oxygen means every task costs you more energy. Settle those first & the same day costs you less.",wake:"07:00",bed:"22:00",water:6,steps:10000},
  {theme:"Raise the floor",note:"Your worst day this week should still beat your best day before you started. Protect the minimum, the rest follows.",wake:"07:00",bed:"22:00",water:6,steps:10000},
  {theme:"Own the standard",note:"Nobody is checking anymore except you. This is the week the habits stop being tasks and become who you are.",wake:"07:00",bed:"22:00",water:6,steps:10000}
];
let WEEKS=store.get(K.weeks,null)||DEFAULT_WEEKS.map(w=>({...w}));

const RESETS=["Breathwork","Meditation","Breath movement","Nasal walk","Heat","Massage","Cold therapy","Time out","Journalling","Grounding","Sun exposure","Brain training"];
const TRAINING=["Gym workout","Home workout","Mobility routine","Rest day"];
const TASKS=[
  {k:"am_state",label:"AM state",type:"rating",sec:"day",hint:"How you feel on waking, 1 to 10"},
  {k:"woke_at",label:"Woke at",type:"time",sec:"day",target:"wake"},
  {k:"outside_early",label:"Outside early",type:"check",sec:"day",hint:"Daylight within the first hour"},
  {k:"todo",label:"To-do list",type:"check",sec:"day",hint:"Today's list written"},
  {k:"steps1",label:"Steps 1",type:"check",sec:"day",split:0,pre:"Before Meal 1 · "},
  {k:"meal1",label:"Meal 1",type:"meal",sec:"day",hint:"Within 90 mins of waking"},
  {k:"meal2",label:"Meal 2",type:"meal",sec:"day"},
  {k:"steps2",label:"Steps 2",type:"check",sec:"day",split:1},
  {k:"meal3",label:"Meal 3",type:"meal",sec:"day"},
  {k:"steps3",label:"Steps 3",type:"check",sec:"day",split:2},
  {k:"meal4",label:"Meal 4",type:"meal",sec:"day"},
  {k:"meal5",label:"Meal 5",type:"meal",sec:"day"},
  {k:"pm_state",label:"PM state",type:"rating",sec:"done",hint:"How you feel tonight, 1 to 10"},
  {k:"full_steps",label:"Full steps",type:"steps",sec:"done"},
  {k:"steps_shot",label:"Steps screenshot",type:"upload",sec:"done"},
  {k:"water",label:"Water",type:"water",sec:"done"},
  {k:"bed",label:"Bed",type:"time",sec:"done",target:"bed"},
  {k:"training",label:"Training",type:"select",options:TRAINING,sec:"done",hint:"What did today look like?"},
  {k:"reset",label:"Resets",type:"multi",options:RESETS,sec:"done",hint:"Every one you used today, from the Reset menu"},
  {k:"brain_dump",label:"Brain dump",type:"textarea",sec:"done"}
];
const splitSteps=s=>{const a=Math.floor(s/3);return[a,a,s-2*a]};

function isDone(t,v,wk){
  if(v===undefined||v===null||v==="")return false;
  switch(t.type){
    case"check":return v===true;
    case"rating":return v>0;
    case"steps":return Number(v)>=wk.steps;
    case"water":return Number(v)>=wk.water;
    case"multi":return resetsOf(v).length>0;
    case"select":return v===true||String(v).trim().length>0;
    default:return String(v).trim().length>0;
  }
}
function onTarget(t,v,wk){
  if(!t.target||!v)return null;
  let m=mins(v),goal=mins(wk[t.target]);
  if(t.target==="bed"){if(m<12*60)m+=1440;if(goal<12*60)goal+=1440}
  return m<=goal+15;
}
const pct=(log,wk)=>log?Math.round(TASKS.filter(t=>isDone(t,log[t.k],wk)).length/TASKS.length*100):0; // same keys on both day types
const resetsOf=v=>Array.isArray(v)?v:(v&&v!==true?[v]:[]);
const mealsLogged=log=>[1,2,3,4,5].filter(i=>String(log["meal"+i]||"").trim());
const TK=k=>TASKS.find(t=>t.k===k);
const isTrainDay=log=>log.day_type?log.day_type==="train":(log.training==="Gym workout"||log.training==="Home workout");
const TRAIN_OPTS=["Gym workout","Home workout"],MOVE_OPTS=["Mobility routine","Breath movement drill","Full rest"];
// The list a client sees for a day, set by the first question: training day or rest day. Same task keys either way, so stats line up.
function tasksFor(log){
  const T=(k,o)=>({...TK(k),...(o||{})});
  const head=["am_state","woke_at","outside_early","todo","steps1"].map(k=>T(k));
  if(log.day_type==="train")return[...head,
    T("meal1"),T("meal2"),T("steps2"),
    T("meal3",{label:"Meal 3 · Pre workout",hint:"Protein + carbs, 60 to 90 mins before training",role:"pre"}),
    T("training",{sec:"day",label:"Training session",options:TRAIN_OPTS}),
    T("meal4",{label:"Meal 4 · Post workout",hint:"Settle first, then protein + carbs",role:"post"}),
    T("steps3"),T("meal5"),
    ...["pm_state","full_steps","steps_shot","water","bed","reset","brain_dump"].map(k=>T(k))];
  const rm=k=>T(k,k==="meal1"?{}:{hint:"Protein + fats + fruit / veg"});
  return[...head,rm("meal1"),rm("meal2"),T("steps2"),rm("meal3"),T("steps3"),rm("meal4"),rm("meal5"),
    ...["pm_state","full_steps","steps_shot","water","bed"].map(k=>T(k)),
    T("training",{label:"Movement",hint:"No weights today. Keep it easy.",options:MOVE_OPTS}),
    ...["reset","brain_dump"].map(k=>T(k))];
}
function mealTags(t,log){
  const train=isTrainDay(log),tags=[["p","Protein"]];
  if(train&&(t.role==="pre"||t.role==="post"))tags.push(["cb","Carbs"]);
  if(!train)tags.push(["ft","Fats, no carbs"]);
  tags.push(["fv","Fruit / veg"],["ns","No added sugar"]);
  if(train)tags.push(["cf","Not carbs + fat"]);
  if(train&&t.k==="meal1")tags.push(["nc","No carbs"]);
  return tags;
}

/* ---------- non negotiables (from the Recharge, Eat, Steps & Evolve pages) ---------- */
// on = a tick chip sitting on that task row; auto = ticks itself from what's logged; both = needs both
// track: weekly = counted across the week, mind = mindset, no tick; when: train = only on gym or home workout days
const NN=[
  {id:"breathe",p:"recharge",name:"Breathe",chip:"Breathing exercise",src:"Resets: Breathwork or Meditation",auto:l=>resetsOf(l.reset).some(x=>x==="Breathwork"||x==="Meditation"),desc:"Oxygen is our life supply. Breathe as much as you can throughout the day. Control the speed that you breathe out. Do 1 breathing exercise per day (Wim Hof / 10 breathless minutes)."},
  {id:"plan",p:"recharge",name:"Plan",chip:"Plan",src:"To-do list",auto:l=>l.todo===true,desc:"Write your to-do list for the day. Prep for the next day. Plan your week."},
  {id:"do_thing",p:"recharge",name:"Do the thing",chip:"Hardest task first",on:"todo",desc:"Do the hardest tasks first. Do what your old comfort zone held you back from."},
  {id:"start_end",p:"recharge",name:"Start right end right",chip:"Phone off 1hr before bed",on:"bed",src:"Woke at & Bed both on target",auto:(l,wk)=>onTarget(TK("woke_at"),l.woke_at,wk)===true&&onTarget(TK("bed"),l.bed,wk)===true,desc:"Your first & last waking hours determine your outcomes. Get out of bed at your set alarm time. Phone off minimum of 1hr before bed time. Wind down before you shut down."},
  {id:"present",p:"recharge",name:"Be present",chip:"Was present",on:"pm_state",desc:"Anything you are doing, do it 100%. Work, training, family, wellness. Multi tasking is spread energy with double the rent cost on your nervous system."},
  {id:"protect",p:"recharge",name:"Protect your energy",chip:"No scrolling till my day started",on:"woke_at",desc:"Don't lose energy on things that destroy your energy like doom scrolling. No doom scrolling or unnecessary interactive phone use until you have started your day fully & built up your own energy first."},
  {id:"awareness",p:"recharge",name:"Awareness",chip:"Awareness",src:"AM state & PM state",auto:l=>l.am_state>0&&l.pm_state>0,desc:"The toughest ask here. You must be honest with yourself & build up incredible self awareness to know what you need to utilise in Project Reset & when. When to push & when to pull back."},
  {id:"reset",p:"recharge",name:"Reset",chip:"Reset",src:"Resets",auto:l=>resetsOf(l.reset).length>0,desc:"As many times daily as you can or need to. Stop every 90 minutes to quiet the mind & realign by using any of the options in the Reset menu or anything else of your choice. Make them the oxygen tank to your day."},

  {id:"pick",p:"eat",name:"Pick it, Kill it, Grow it rule",chip:"No added sugar",src:"the No added sugar tag on every meal",auto:l=>{const m=mealsLogged(l);return m.length>0&&m.every(i=>l["meal"+i+"_ns"])},desc:"No added sugar. Sugar in whole fruit & honey in small amounts is permitted. Use gluten free alternatives. No overly processed foods made up from numerous extra ingredients."},
  {id:"meal_timing",p:"eat",name:"Meal volume & timings",chip:"4+ meals",src:"Meals 1 to 5",auto:l=>mealsLogged(l).length>=4,desc:"Meal 1 eaten within 90 minutes of waking & then after aim to eat evenly spread every 3-4hrs through the day totalling you to 4-5 meals minimum daily."},
  {id:"protein",p:"eat",name:"Protein",chip:"Protein every meal",src:"Protein tags on your meals",auto:l=>{const m=mealsLogged(l);return m.length>=4&&m.every(i=>l["meal"+i+"_p"])},desc:"Protein at every meal. 4-5x daily in large portions. With the largest amount in your 1st & last meal of the day."},
  {id:"portion",p:"eat",name:"Portion size & restrictions",chip:"Not carbs + fat",when:"train",src:"the Not carbs + fat tag on every meal (rest days are fats only, so this is covered)",auto:l=>{const m=mealsLogged(l);return m.length>0&&m.every(i=>l["meal"+i+"_cf"])},desc:"Avoid high carbs in the same meal with high fat. Both are welcome in any amount so long as protein is always on the plate but never all 3 combined. Protein has no restriction in size for any meal."},
  {id:"no_carbs_m1",p:"eat",name:"No carbs meal 1",chip:"No carbs meal 1",src:"the No carbs tag on Meal 1 (Fats, no carbs on rest days)",auto:l=>!!String(l.meal1||"").trim()&&(isTrainDay(l)?l.meal1_nc===true:l.meal1_ft===true),desc:"No carbohydrates at Meal 1. Only protein, fats & fruit or veg. The only exception is if you lift weights early in the morning. But if possible avoid AM lifting workouts regardless."},
  {id:"water_salt",p:"eat",name:"Water & salt",chip:"Salt with meals",on:"water",src:"hitting your water target",auto:(l,wk)=>Number(l.water)>=wk.water,desc:"Drink 500ml of water when you wake up & with every meal driving you to your targeted amount. Salt added to every meal possible, especially containing carbs."},
  {id:"fruit_veg",p:"eat",name:"Fruit & veg",chip:"Fruit & veg",src:"Fruit / veg tags on your meals",auto:l=>{const m=mealsLogged(l);return m.filter(i=>l["meal"+i+"_fv"]).length>=3&&!!l["meal"+m[0]+"_fv"]&&!!l["meal"+m[m.length-1]+"_fv"]},desc:"As much & as often as you like with & between meals when hungry, stressed or low on energy. First & last meal must have 1 fruit or veg or both. Minimum is at least 3 times a day of each."},
  {id:"carbs_train",p:"eat",name:"Carbs on days you train. Fats on days you don't.",chip:"Carbs or fats matched to today",src:"the Carbs tag on your pre & post workout meals, or Fats, no carbs on every rest day meal",auto:l=>{if(isTrainDay(l))return l.meal3_cb===true&&l.meal4_cb===true;const m=mealsLogged(l);return m.length>0&&m.every(i=>l["meal"+i+"_ft"])},desc:"Create a training day focused meal plan & a non training day plan to align with this."},
  {id:"chew",p:"eat",name:"Move, breathe & chew first",chip:"Breathed & chewed at meals",on:"pm_state",desc:"Before each meal you must do some movement first by either hitting steps or exercise & oxygenate your body with slow, deep calming breaths. Chew your food as small as you can before swallowing."},
  {id:"caffeine",p:"eat",name:"Caffeine",chip:"Caffeine rules kept",on:"water",desc:"Maximum 2 caffeinated drinks a day. None before Meal 1. None after 1pm. Never add caffeine to an already fast working brain."},
  {id:"pre_workout",p:"eat",name:"Pre workout",chip:"Fuelled & hydrated before",on:"meal3",onLabel:"your pre workout meal",when:"train",desc:"Never go into a workout unless you feel properly fuelled & hydrated to do so first."},
  {id:"post_workout",p:"eat",name:"Post workout",chip:"Settled before eating",on:"meal4",onLabel:"your post workout meal",when:"train",desc:"Settle the nervous system first, lower your heart rate & oxygenate your body before eating."},

  {id:"hit_number",p:"steps",name:"Hit your number",chip:"Hit your number",src:"Full steps",auto:(l,wk)=>Number(l.full_steps)>=wk.steps,desc:"Your coach sets one steps number for the week. Hit it consistently every day. More 1 day doesn't mean you can do less another day. The body doesn't work like that."},
  {id:"spread",p:"steps",name:"Spread them",chip:"Spread them",src:"Steps 1, 2 & 3",auto:l=>l.steps1===true&&l.steps2===true&&l.steps3===true,desc:"Spread your steps through the day especially around meal times."},
  {id:"walk_first",p:"steps",name:"Walk first",chip:"Walk first",src:"Steps 1",auto:l=>l.steps1===true,desc:"Walk before Meal 1, ideally around sunrise. It sets your circadian rhythm, puts a dent in your number & helps trigger your nervous system into using fat as energy for the day ahead."},
  {id:"keep_easy",p:"steps",name:"Keep it easy",chip:"Kept it easy",on:"full_steps",desc:"Steps aren't a reason to add hard cardio on top. Steps work best for healthy functioning of the body & mind when done in a low stress state, so don't turn a recovery & fat loss tool into a taxing nervous system demand on your system."},
  {id:"screenshot",p:"steps",name:"Screenshot it",chip:"Screenshot",src:"Steps screenshot",auto:l=>!!String(l.steps_shot||"").trim(),desc:"At the end of the day, add a screenshot of your full step count to your tracker. No screenshot means the steps aren't counted for that day."},
  {id:"brain_walk",p:"steps",name:"Give your brain a walk",chip:"No podcast or music",on:"full_steps",desc:"Don't distract yourself with podcasts or music. Your brain will become more quiet when you finally let it run out of steam on its own. Use your step target as a reason to balance your stress. Nobody ever came back from a walk more angry than before they left."},
  {id:"breathe_walk",p:"steps",name:"Breathe & walk",chip:"Nasal breathing",on:"full_steps",desc:"Oxygen is our life supply. Controlling your breath whilst you hit your steps turns 2 of the most vital aspects of the project into a mega dose of 'Human rocket fuel' into your cells. For the upgrade, do all your breathing with your mouth closed: nasal breathing."},

  {id:"weights",p:"evolve",name:"Train with weights 3 to 5 times",chip:"Weights 3 to 5x a week",track:"weekly",src:"Training session on your training days",desc:"3 to 5 sessions a week."},
  {id:"drills",p:"evolve",name:"Breath focused body movement drills",chip:"Breath movement drill",src:"Resets: Breath movement, or a rest day Movement pick",auto:l=>resetsOf(l.reset).includes("Breath movement")||l.training==="Mobility routine"||l.training==="Breath movement drill",desc:"x7 days weekly to train your breath to work in sync with your movement."},
  {id:"prep",p:"evolve",name:"Prep your system",chip:"Warmed up 5 to 10 mins",on:"training",when:"train",desc:"Pre workout movement preps & warm ups are essential for this. 5-10 mins no matter what."},
  {id:"freq_tax",p:"evolve",name:"Follow the frequency tax",chip:"Kept to session time",on:"training",when:"train",desc:"The more you train the less time you spend. 3x per week = 60-90 mins. 5x per week = 30-40 mins."},
  {id:"muscles",p:"evolve",name:"Use the muscles not your brain",track:"mind",desc:"Strength training or intense workouts aren't exclusively paid for by your muscles & cardio. Your brain & nervous system is what picks up the tab when they tap out. Focus on workouts that don't mentally push you but do so physically in the muscle groups you are working. Build that mind muscle connection & let your brain become the passenger."},
  {id:"habits",p:"evolve",name:"Build habits not PBs",track:"mind",desc:"This isn't the phase or space for maxing out. Build your consistency first. The body works better with consistency than it does shock & can start to adapt how it uses your food properly in your system rather than gatekeeping it & letting it turn to fat."},
  {id:"fuel",p:"evolve",name:"Train to your fuel count",chip:"Ate enough to fuel it",on:"meal4",onLabel:"your post workout meal",when:"train",desc:"Eat enough to do enough & then eat some more after that to keep you above the balance needed for workouts that use what you've got & not tap into your central nervous system energy reservoirs."},
  {id:"baseline",p:"evolve",name:"Return to baseline",chip:"Reset after training",when:"train",src:"Resets",auto:l=>resetsOf(l.reset).length>0,desc:"Post workout, bring your heart rate down as soon as possible using the Reset menu. The sooner you return to baseline, the sooner you recover, the better you sleep."},
  {id:"selfish",p:"evolve",name:"Don't be selfish",chip:"Protein to match training",when:"train",src:"Protein tags on your meals",auto:l=>{const m=mealsLogged(l);return m.length>=4&&m.every(i=>l["meal"+i+"_p"])},desc:"It's not just your muscles that need the large protein allowance. Over worked muscles demand more protein, leaving less spared for all the other areas in your body in need of it too, like your over worked brain. Train hard, eat protein harder or feel the strain in your day."}
];
const PILLARS=[
  {id:"recharge",letter:"R",name:"Recharge",tag:"Recovering from stress adequately & having higher resilience to stress in the first place",approach:[
    "Everything in this space runs off of how settled your nervous system is. We have the full waking hours to control our nervous system via our actions. Which then lead to more control within our sleeping hours. Which then cycle back round to the waking again hours again. But this time improved & with momentum gained.",
    "The actions below are listed as non negotiables for you to focus on & have been carefully selected to cover aspects we all have the ability to control, even if at the start it feels like you cannot.",
    "But this is where Project Reset comes in to hold you to a standard of living which you are missing. This standard of living is what leads you to reaching your goals for the future, allowing you to apply this standard to your own bespoke plan.",
    ">Each of the non negotiables WILL link into your daily tracker either directly or indirectly. Understanding each one will lead to higher impact on the task itself & lead to greater result."],
   extra:["#The Reset menu","Tap any of these into Resets on your tracker. Use one every 90 minutes, or whenever you need it.",
    ["Breathwork: slow nasal breathing, exhale longer than the inhale. Ideal in the morning, at the end of the day, when energy is low or after sitting at a desk.","Meditation: 5 to 10 minutes, sat or lying still, with one point of focus: your breath, a word or a count.","Breath movement (Yoga / Pilates / Movement drill): any style, 15 minutes or more. Movement paired with breath, not a workout.","Nasal walk: a walk outside, breathing through the nose only, no headphones.","Heat (Sauna / Steam / Hot bath): 15 to 20 minutes, if you have access.","Massage: any form. Self, partner or booked.","Cold therapy (Sea dip / Cold shower / Cold plunge): start at 3 minutes & add 30 seconds each week.","Time out: 15 minutes of something you enjoy.","Journalling","Grounding: bare feet on grass, sand or earth, 10 minutes or more.","Sun exposure","Brain training"]]},
  {id:"eat",letter:"E",name:"Eat",tag:"Nourishing correctly so your energy systems don't need to rely on the CNS for energy",approach:[
    "The main focus for your food is protein, fruit & veg at the top of the list in high amounts. Carbs & fats next on the priority list. All packed with vital nutrients, vitamins & electrolytes that restore your energy & physique building capability.",
    "Nourishment is the name of the game here. This works to build you into a position where more food leads to more recovery & fat loss, because a central nervous system will stop doing the work that your food should be doing instead of just being used as fat storage.",
    "You will not gain fat eating this way by following the full formula that runs throughout the project. The methodology points below are listed as non negotiables for you to focus on the right process to repair a malfunctioning system. You do not need a specific weighed out meal plan until your body is operating to a level it can know the differences with. That comes next."]},
  {id:"steps",letter:"S",name:"Steps",tag:"Movement to regulate the body & brain",approach:[
    ">Focus on: easy movement every day, spread through the day.",

    "Breath focused body movement drills x7 days weekly.",

const nnApplies=(n,log)=>n.track!=="mind"&&n.track!=="weekly"&&(n.when!=="train"||isTrainDay(log));
const nnKept=(n,log,wk)=>(n.auto?!!n.auto(log,wk):true)&&(n.on?log["nn_"+n.id]===true:true);

function nnScore(log,wk){const a=NN.filter(n=>nnApplies(n,log));const k=a.filter(n=>nnKept(n,log,wk)).length;return{kept:k,total:a.length,pct:a.length?Math.round(k/a.length*100):0}}
function nnRates(rows){const out={};NN.forEach(n=>{if(n.track==="mind")return;let a=0,k=0;rows.forEach(x=>{if(n.track==="weekly")return;if(nnApplies(n,x.log)){a++;if(nnKept(n,x.log,x.wk))k++}});out[n.id]={a,k,p:a?Math.round(k/a*100):null}});return out}
const hasAny=log=>log&&Object.values(log).some(v=>v!==""&&v!==false&&v!==null&&v!==undefined);

/* ---------- demo clients (sample data) ---------- */
const CLIENTS=[
  {id:"sarah",name:"Sarah Mitchell",email:"sarah@example.com",offset:0,base:.86,drift:.05},

function rngFor(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);let t=(h^=h>>>16)>>>0;t+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

function partialCut(){const h=NOW.getHours();return h<8?0:h<10?3:h<12?6:h<15?9:h<18?11:h<21?14:TASKS.length}

const GEN={};
function generated(c){
  if(GEN[c.id])return GEN[c.id];
  const rng=rngFor(c.id),out={},today=clientDayNum(c);
  for(let d=1;d<=today;d++){
    const date=ymd(dateOf(c,d)),wk=weekOf(d),isToday=d===today;
    if(c.gone&&d>today-c.gone)continue;
    if(c.id==="sarah"&&isToday)continue; // the demo login fills today in
    const p=clamp(c.base+c.drift*(d/14)+(rng()-.5)*.22,.08,.99);
    const L={},cut=isToday?partialCut():TASKS.length;
    if(cut>0)L.day_type=rng()<.5?"train":"rest";
    tasksFor(L).forEach((t,i)=>{
      const r=rng();if(i>=cut)return;
      const hit=r<p;
      switch(t.type){
        case"rating":if(rng()<p+.15)L[t.k]=Math.round(clamp(3+p*6+(rng()-.5)*3,1,10));break;
        case"time":{if(rng()>p+.1)break;const base=mins(wk[t.target]);L[t.k]=hhmm(base+(rng()-.3)*(t.target==="bed"?110:70)*(1.15-p));break}
        case"check":if(hit)L[t.k]=true;break;
        case"meal":if(hit){L[t.k]=MEALS[Math.floor(rng()*MEALS.length)];mealTags(t,L).forEach(([g])=>{if(rng()<p+.08)L[t.k+"_"+g]=true})}break;
        case"steps":L[t.k]=hit?Math.round(wk.steps*(1+rng()*.35)):(rng()<.7?Math.round(wk.steps*(.35+rng()*.55)):"");break;
        case"water":L[t.k]=hit?wk.water+Math.round(rng()*2)/2:(rng()<.7?Math.round(wk.water*(.4+rng()*.5)*2)/2:"");break;
        case"upload":if(hit)L[t.k]="steps-"+date+".png";break;
        case"select":if(hit)L[t.k]=t.options[Math.floor(rng()*t.options.length)];break;
        case"multi":if(hit){const n=1+Math.floor(rng()*3),pk=new Set();for(let j=0;j<n;j++)pk.add(RESETS[Math.floor(rng()*RESETS.length)]);L[t.k]=[...pk]}break;
        case"textarea":if(hit&&rng()<.7)L[t.k]=DUMPS[Math.floor(rng()*DUMPS.length)];break;
      }
    });
    if(cut===TASKS.length)NN.forEach(n=>{if(n.on&&rng()<p-.05)L["nn_"+n.id]=true});
    out[date]=L;
  }
  return GEN[c.id]=out;
}

}

function statsFor(c){
  const logs=logsFor(c),today=clientDayNum(c),days=[];
  for(let d=1;d<=today;d++){const date=ymd(dateOf(c,d)),wk=weekOf(d),log=logs[date]||{};const nn=nnScore(log,wk);days.push({d,date,wk,log,pct:pct(log,wk),nn:nn.pct,any:hasAny(log)})}
  const past=days.filter(x=>x.d<today);
  const last7=past.slice(-7);
  const avg7=last7.length?Math.round(last7.reduce((a,x)=>a+x.pct,0)/last7.length):days[days.length-1].pct;
  const nnRows=last7.length?last7:days.slice(-1);
  const nn7=Math.round(nnRows.reduce((a,x)=>a+x.nn,0)/nnRows.length);
  let streak=0;
  const todayRow=days[days.length-1];
  if(todayRow.pct>=70)streak++;
  for(let i=past.length-1;i>=0;i--){if(past[i].pct>=70)streak++;else break}
  let lastLog=null;for(let i=days.length-1;i>=0;i--){if(days[i].any){lastLog=days[i];break}}
  const since=lastLog?today-lastLog.d:today;
  const numAvg=(k,rows)=>{const v=rows.map(x=>Number(x.log[k])).filter(n=>n>0);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
  const bedRows=last7.filter(x=>x.log.bed);
  const bedOn=bedRows.length?Math.round(bedRows.filter(x=>onTarget(TASKS.find(t=>t.k==="bed"),x.log.bed,x.wk)).length/last7.length*100):0;
  let status="ok";
  if(since>=2||avg7<45)status="bad";else if(avg7<70)status="warn";
  return{c,days,today,todayPct:todayRow.pct,todayNN:todayRow.nn,nn7,nnRows,avg7,streak,since,lastLog,
    steps7:numAvg("full_steps",last7),am7:numAvg("am_state",last7),pm7:numAvg("pm_state",last7),bedOn,status};
}

function nnChips(t,log){

}
function taskRow(t,v,wk,sp,log={}){

  if(!chips)return html;
  const open=html.indexOf(">")+1,close=html.lastIndexOf("</");

function baseRow(t,v,wk,sp,log){
  const done=isDone(t,v,wk),cls=`row${done?" done":""}`,tick=`<span class="tick">${TICK}</span>`;
  const hint=t.k==="training"&&t.options===TRAIN_OPTS?`${WEEK_SESS} weights ${WEEK_SESS===1?"session":"sessions"} this week · target 3 to 5`:t.split!=null?`${t.pre||""}${sp[t.split].toLocaleString("en-GB")} steps`:(t.hint||"");

  switch(t.type){
    case"check":
      return `<button class="${cls}" data-k="${t.k}" data-type="check" aria-pressed="${done}">${tick}${lbl}</button>`;

      return `<div class="${cls} stacked" data-k="${t.k}"><div class="top-line">${tick}${lbl}</div>

    }
    case"text":
      return `<div class="${cls}" data-k="${t.k}">${tick}${lbl}<input class="input ctrl" type="text" id="f-${t.k}" placeholder="What did you eat?" value="${esc(v||"")}" aria-label="${t.label}"></div>`;
    case"textarea":
      return `<div class="${cls} stacked" data-k="${t.k}"><div class="top-line">${tick}${lbl}</div><textarea class="input" id="f-${t.k}" placeholder="Anything on your mind from today" aria-label="${t.label}">${esc(v||"")}</textarea></div>`;
    case"steps":{
      const n=Number(v)||0,w=Math.min(100,n/wk.steps*100);
      return `<div class="${cls} stacked" data-k="${t.k}"><div class="top-line">${tick}<span class="lbl"><strong>Full steps</strong><small class="num" data-live="steps">${n.toLocaleString("en-GB")} / ${wk.steps.toLocaleString("en-GB")} (${sp.map(x=>x.toLocaleString("en-GB")).join(" + ")})</small></span><input class="input ctrl" type="number" inputmode="numeric" min="0" step="1" id="f-${t.k}" value="${v===undefined?"":esc(v)}" placeholder="0" aria-label="Full steps"></div><div class="bar"><i style="width:${w}%"></i></div></div>`;
    }
    case"water":{
      const n=Number(v)||0,w=Math.min(100,n/wk.water*100);
      return `<div class="${cls} stacked" data-k="${t.k}"><div class="top-line">${tick}${lbl}<div class="stepper"><button data-water="-0.5" aria-label="Less water">&minus;</button><b class="num">${n}L</b><button data-water="0.5" aria-label="More water">+</button></div></div><div class="bar"><i style="width:${w}%"></i></div></div>`;
    }
    case"meal":
      return `<div class="${cls} stacked" data-k="${t.k}"><div class="top-line">${tick}${lbl}<input class="input ctrl" type="text" id="f-${t.k}" placeholder="What did you eat?" value="${esc(v||"")}" aria-label="${t.label}"></div></div>`;
    case"select":
      return `<div class="${cls} stacked" data-k="${t.k}"><div class="top-line">${tick}${lbl}</div><div class="opts">${t.options.map(o=>`<button class="chip" data-opt="${esc(o)}" aria-pressed="${v===o}">${o}</button>`).join("")}</div></div>`;
    case"multi":{const sel=resetsOf(v);
      return `<div class="${cls} stacked" data-k="${t.k}"><div class="top-line">${tick}<span class="lbl"><strong>${t.label}${sel.length?` <span class="num muted">${sel.length}</span>`:""}</strong><small>${esc(t.hint)}</small></span></div><div class="opts">${t.options.map(o=>`<button class="chip" data-multi="${esc(o)}" aria-pressed="${sel.includes(o)}">${o}</button>`).join("")}</div></div>`;}
    case"upload":
      return `<div class="${cls}" data-k="${t.k}">${tick}<span class="lbl"><strong>${t.label}</strong><small>${v?esc(v):"From your phone's health app"}</small></span><label class="chip upload" for="f-${t.k}">${v?"Replace":"Upload"}<input type="file" id="f-${t.k}" accept="image/*"></label></div>`;
  }
}

/* ---------- charts ---------- */
function chart({n,series,max,target,fmt,kind,labelEvery}){
  const W=640,H=190,pl=44,pr=12,pt=12,pb=26,iw=W-pl-pr,ih=H-pt-pb,bw=iw/Math.max(n,1);
  const xc=i=>pl+bw*(i+.5),y=v=>pt+ih-(v/max)*ih;
  const ticks=[0,max/2,max];
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  ticks.forEach(t=>{s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end">${fmt(t)}</text>`});
  for(let i=0;i<n;i++){if(i===0||(i+1)%(labelEvery||7)===0||i===n-1)s+=`<text x="${xc(i)}" y="${H-8}" text-anchor="middle">D${i+1}</text>`}
  if(target!=null)s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(target)}" y2="${y(target)}" stroke="var(--fg)" stroke-dasharray="4 4" stroke-width="1" opacity=".6"/><text x="${W-pr}" y="${y(target)-5}" text-anchor="end" style="fill:var(--fg)">Target</text>`;
  series.forEach(se=>{
    if(kind==="bar"){
      se.values.forEach((v,i)=>{if(v==null)return;const h=Math.max(1,(Math.min(v,max)/max)*ih);s+=`<rect x="${xc(i)-bw*.32}" y="${pt+ih-h}" width="${bw*.64}" height="${h}" rx="3" fill="${target!=null&&v<target?"var(--surface-2)":se.color}" stroke="var(--green-ink)" stroke-width="1"><title>Day ${i+1}: ${fmt(v)}</title></rect>`});
    }else{
      const pts=se.values.map((v,i)=>v==null?null:[xc(i),y(Math.min(v,max))]);
      const segs=[];let cur=[];pts.forEach(p=>{if(p)cur.push(p);else if(cur.length){segs.push(cur);cur=[]}});if(cur.length)segs.push(cur);
      segs.forEach(sg=>{
        if(se.area&&sg.length>1)s+=`<path d="M${sg[0][0]},${pt+ih} L${sg.map(p=>p.join(",")).join(" L")} L${sg[sg.length-1][0]},${pt+ih} Z" fill="${se.color}" opacity=".14"/>`;
        s+=`<polyline points="${sg.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${se.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
      });
      pts.forEach((p,i)=>{if(p)s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4.5:2.5}" fill="${se.color}"><title>Day ${i+1}: ${fmt(se.values[i])}</title></circle>`});
    }
  });
  return s+"</svg>";
}
function heatmap(st,{clickable,sel}={}){
  const cells=[];
  for(let d=1;d<=PROGRAMME_DAYS;d++){
    const row=st.days[d-1],future=d>st.today;
    const cls=`cell ${future?"future":lvl(row?row.pct:0)}${d===st.today?" today":""}${sel===d?" sel":""}`;
    const label=future?`Day ${d}, upcoming`:`Day ${d}, ${row.pct}% done`;
    cells.push(clickable&&!future?`<button class="${cls}" data-hday="${d}" aria-label="${label}" title="${label}">${d}</button>`:`<div class="${cls}" title="${label}">${d}</div>`);
  }
  const start=clientStart(st.c);
  const heads=Array.from({length:7},(_,i)=>addDays(start,i).toLocaleDateString("en-GB",{weekday:"short"}));
  return `<div class="heat-head">${heads.map(h=>`<span>${h}</span>`).join("")}</div><div class="heat">${cells.join("")}</div>
  <div class="legend" style="margin-top:10px"><span><i style="background:var(--lime)"></i>70%+</span><span><i style="background:color-mix(in srgb,var(--lime) 45%,var(--surface))"></i>40 to 69%</span><span><i style="background:color-mix(in srgb,var(--lime) 18%,var(--surface))"></i>Under 40%</span><span><i></i>Nothing logged</span></div>`;
}
function trendCharts(st){
  const n=st.today;
  const comp=st.days.map(x=>x.pct),nnv=st.days.map(x=>x.nn);
  const steps=st.days.map(x=>x.log.full_steps?Number(x.log.full_steps):null);
  const am=st.days.map(x=>x.log.am_state||null),pm=st.days.map(x=>x.log.pm_state||null);
  const tgt=weekOf(n).steps;
  return `<div class="two">
    <section class="card"><div class="sec-head"><h3 class="sec-title" style="font-size:20px">Daily completion</h3><div class="keyrow"><span><i style="background:var(--green-ink)"></i>Tasks</span><span><i style="background:var(--fg)"></i>Non negotiables</span></div></div>${chart({n,series:[{values:comp,color:"var(--green-ink)",area:true},{values:nnv,color:"var(--fg)"}],max:100,fmt:v=>Math.round(v)+"%"})}</section>
    <section class="card"><div class="sec-head"><h3 class="sec-title" style="font-size:20px">Steps</h3></div>${chart({n,kind:"bar",series:[{values:steps,color:"var(--lime)"}],max:Math.max(16000,...steps.filter(Boolean)),target:tgt,fmt:v=>v>=1000?Math.round(v/1000)+"k":String(Math.round(v))})}</section>
    <section class="card"><div class="sec-head"><h3 class="sec-title" style="font-size:20px">AM and PM state</h3><div class="keyrow"><span><i style="background:var(--green-ink)"></i>AM</span><span><i style="background:var(--fg)"></i>PM</span></div></div>${chart({n,series:[{values:am,color:"var(--green-ink)"},{values:pm,color:"var(--fg)"}],max:10,fmt:v=>String(Math.round(v))})}</section>
  </div>`;
}

        ${S.hview==="nn"?(()=>{const rows=[];all.forEach(s=>s.nnRows.forEach(x=>rows.push(x)));const r=nnRates(rows);
          const list=NN.filter(n=>r[n.id]&&r[n.id].p!=null).sort((a,b)=>r[a.id].p-r[b.id].p);
          return `<p class="muted" style="font-size:12px;margin-bottom:8px">Share of client days each non negotiable was kept, weakest first. Training day items only count on training days.</p>`+list.map(n=>{const x=r[n.id],P=PILLARS.find(q=>q.id===n.p);return `<div class="habit"><span title="${esc(n.name)}"><span class="pl">${P.name}</span> ${esc(n.chip)}</span><div class="bar"><i class="${x.p<50?"low":x.p<70?"mid":""}" style="width:${x.p}%"></i></div><span class="num" style="text-align:right">${x.p}%</span></div>`}).join("")})()
        :`<p class="muted" style="font-size:12px;margin-bottom:8px">Share of client days each task was completed, weakest first.</p>`+hb.map(h=>`<div class="habit"><span>${h.t.label}</span><div class="bar"><i class="${h.p<50?"low":h.p<70?"mid":""}" style="width:${h.p}%"></i></div><span class="num" style="text-align:right">${h.p}%</span></div>`).join("")}
      </section>
    </div>
  </div>`;
}
function detailView(c){
  const st=statsFor(c),[cls,lab]=STATUS[st.status];
  const sel=S.detailDay||st.today,row=st.days[sel-1],wk=row.wk;
  const note=(store.get(K.notes,{})[c.id])||{};
  return `<div class="stack">
    <div><button class="chip" data-act="back">&lsaquo; All clients</button></div>
    <div class="detail-head">
      <div><span class="eyebrow">Started ${fmtShort(clientStart(c))} · Day ${st.today} of ${PROGRAMME_DAYS}</span><h1 class="display">${esc(c.name)}</h1></div>
      <span class="pill ${cls}" style="font-size:14px">${lab}</span>
    </div>
    <div class="tiles">
      <div class="tile"><small>Last 7 days</small><b class="num">${st.avg7}%</b></div>
      <div class="tile"><small>Non negotiables, 7 days</small><b class="num">${st.nn7}%</b></div>
      <div class="tile"><small>Streak</small><b class="num">${st.streak}</b></div>
      <div class="tile"><small>Avg steps, 7 days</small><b class="num">${st.steps7?Math.round(st.steps7).toLocaleString("en-GB"):"–"}</b></div>
      <div class="tile"><small>Bed on time, 7 days</small><b class="num">${st.bedOn}%</b></div>
    </div>
    <div class="two">
      <section class="card"><div class="sec-head"><h2 class="sec-title" style="font-size:20px">28 day map</h2><span class="muted" style="font-size:12px">Select a day to see its log</span></div>${heatmap(st,{clickable:true,sel})}</section>
      <section class="card"><div class="sec-head"><h2 class="sec-title" style="font-size:20px">Day ${sel} log</h2><span class="muted num">${fmtShort(dateOf(c,sel))} · ${row.log.day_type==="train"?"Training day":row.log.day_type==="rest"?"Rest day":"Day type not set"} · ${row.pct}%</span></div>
        <div class="log-list">${tasksFor(row.log).map(t=>{const v=row.log[t.k],d=isDone(t,v,wk);let shown=v===undefined||v===""||v===false?"–":v===true?"Done":t.type==="water"?v+"L":t.type==="steps"?Number(v).toLocaleString("en-GB"):t.type==="rating"?v+" / 10":t.type==="multi"?resetsOf(v).join(", ")||"–":t.type==="meal"&&v?v+mealTags(t,row.log).filter(([g])=>row.log[t.k+"_"+g]).map(([,l])=>" · "+l).join(""):v;
          const ot=onTarget(t,v,wk);if(ot===false)shown+=" (late)";
          return `<div class="${d?"":"miss"}"><span>${d?"✓ ":""}${t.label}</span><span>${esc(shown)}</span></div>`}).join("")}</div>
        ${(()=>{const sc=nnScore(row.log,wk);return `<div class="sec-head" style="margin-top:16px"><h3 class="sec-title" style="font-size:18px">Non negotiables</h3><span class="muted num">${sc.kept} / ${sc.total} kept</span></div>
        ${PILLARS.map(P=>{const items=NN.filter(n=>n.p===P.id&&nnApplies(n,row.log));return `<div class="nn-head" style="margin-top:8px"><span class="pl" style="font-size:22px">${P.letter}</span><span class="eyebrow">${P.name}</span></div><div class="nn-chips" style="margin-top:4px">${items.map(n=>{const k=nnKept(n,row.log,wk);return `<span class="nn-chip ${k?"kept":"miss"}" title="${esc(n.name)}">${k?"✓ ":"✗ "}${esc(n.chip)}</span>`}).join("")}</div>`}).join("")}`})()}
      </section>
    </div>
    ${trendCharts(st)}
    ${nnBreakdown(st.nnRows,"Non negotiables, last 7 days","How often "+esc(c.name.split(" ")[0])+" kept each one, by pillar.")}
    <section class="card stack" style="gap:10px"><div class="sec-head"><h2 class="sec-title" style="font-size:20px">Note to ${esc(c.name.split(" ")[0])}</h2>${note.at?`<span class="muted" style="font-size:12px">Last sent ${fmtShort(new Date(note.at))}</span>`:""}</div>
      <label for="coachNote" class="muted" style="font-size:13px">Shows at the top of their Today screen.</label>
      <textarea class="input" id="coachNote" placeholder="Great week. Bed time is the one to tighten up next.">${esc(note.text||"")}</textarea>
      <div><button class="btn primary" data-act="send-note" data-c="${c.id}">Send note</button></div>
    </section>
  </div>`;
}
function settingsView(){
  return `<div class="stack">
    <div><span class="eyebrow">Coach only</span><h1 class="display" style="font-size:clamp(44px,9vw,68px)">Your numbers</h1>
    <p class="muted" style="max-width:62ch;margin-top:6px">Set each week's theme, sticky note and targets. Every client sees the week they are on, so changes apply to everyone at that stage.</p></div>
    <div class="tbl-wrap weeks-tbl"><table>
      <thead><tr><th>Week</th><th>Week start</th><th>Theme</th><th>Wake</th><th>Bed by</th><th>Water (L)</th><th>Steps</th><th>Sticky note</th></tr></thead>
      <tbody>${WEEKS.map((w,i)=>`<tr style="cursor:default">
        <td><strong>Week ${i+1}</strong></td><td class="num">${fmtShort(addDays(COHORT,i*7))}</td>
        <td><input class="input" id="w${i}-theme" data-w="${i}" data-f="theme" value="${esc(w.theme)}" style="width:190px"></td>
        <td><input class="input" type="time" id="w${i}-wake" data-w="${i}" data-f="wake" value="${esc(w.wake)}"></td>
        <td><input class="input" type="time" id="w${i}-bed" data-w="${i}" data-f="bed" value="${esc(w.bed)}"></td>
        <td><input class="input" type="number" step="0.5" min="0" id="w${i}-water" data-w="${i}" data-f="water" value="${w.water}" style="width:80px"></td>
        <td><input class="input" type="number" step="500" min="0" id="w${i}-steps" data-w="${i}" data-f="steps" value="${w.steps}" style="width:100px"></td>
        <td style="white-space:normal"><textarea class="input" id="w${i}-note" data-w="${i}" data-f="note" style="width:280px;min-height:70px">${esc(w.note)}</textarea></td></tr>`).join("")}</tbody>
    </table></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" data-act="save-weeks">Save changes</button><button class="btn" data-act="reset-weeks">Restore defaults</button></div>
    <p class="note">Week 2's theme and sticky note come from the Notion page. Weeks 1, 3 and 4 are sample wording for Ellis to replace. Week starts shown are for the current sample cohort.</p>
  </div>`;
}

/* ---------- client edits: update in place to keep focus ---------- */
function ctx(){const el=root.querySelector("[data-date]");return el?{date:el.dataset.date,dn:Number(el.dataset.day)}:null}
function commit(k,v,rerenderRow,rowKey){
  const c=me(),x=ctx();if(!c||!x)return;
  saveEdit(c.id,x.date,k,v);
  const rk=rowKey||k,wk=weekOf(x.dn),log=logsFor(c)[x.date]||{},t=tasksFor(log).find(t=>t.k===rk);
  const rowEl=t?root.querySelector(`[data-k="${rk}"]`):null;
  if(rerenderRow&&rowEl){rowEl.outerHTML=taskRow(t,log[rk],wk,splitSteps(wk.steps),log)}
  else if(rowEl){rowEl.classList.toggle("done",isDone(t,log[rk],wk))}
  WEEK_SESS=weekSessions(c,x.dn);
  const ns=root.querySelector("#nnSum");if(ns)ns.innerHTML=nnSumHtml(log,wk);
  const p=pct(log,wk),arc=root.querySelector(".ring-arc");
  if(arc){const c2=Number(arc.getAttribute("stroke-dasharray"));arc.setAttribute("stroke-dashoffset",c2*(1-p/100))}
  const rp=root.querySelector("#ringPct");if(rp)rp.textContent=p+"%";
  ["day","done"].forEach(s=>{const el=root.querySelector(`[data-count="${s}"]`),ts=tasksFor(log).filter(t=>t.sec===s);if(el)el.textContent=`${ts.filter(t=>isDone(t,log[t.k],wk)).length} / ${ts.length}`});
}

root.addEventListener("submit",e=>{
  if(e.target.id==="loginForm"){e.preventDefault();login("client")}
});
function login(role){S.session=role==="coach"?{role}:{role,clientId:"sarah"};store.set(K.session,S.session);S.tab="today";S.coachTab="overview";S.detail=null;S.viewDay=null;render();window.scrollTo(0,0)}

root.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-client]");if(!b)return;
  const act=b.dataset.act;
  if(act==="demo-client")return login("client");
  if(act==="demo-coach")return login("coach");
  if(act==="logout"){S.session=null;store.set(K.session,null);return render()}
  if(b.dataset.daytype){const c=me(),x=ctx(),cur=(logsFor(c)[x.date]||{}).day_type;if(cur!==b.dataset.daytype){saveEdit(c.id,x.date,"day_type",b.dataset.daytype);if(cur)saveEdit(c.id,x.date,"training","")}return render()}
  if(b.dataset.pillar){S.tab="programme";S.openPillar=b.dataset.pillar;render();const el=document.getElementById("pillar-"+b.dataset.pillar);if(el)el.scrollIntoView({block:"start"});return}
  if(b.dataset.hview){S.hview=b.dataset.hview;return render()}
  if(b.dataset.nn){const on=b.getAttribute("aria-pressed")!=="true",rk=b.closest("[data-k]");return commit("nn_"+b.dataset.nn,on,true,rk&&rk.dataset.k)}
  if(b.dataset.tab){if(S.session.role==="coach"){S.coachTab=b.dataset.tab;S.detail=null}else{S.tab=b.dataset.tab}render();window.scrollTo(0,0);return}
  if(act==="day"){const c=me(),t=clientDayNum(c),d=Number(b.dataset.d);S.viewDay=d===t?null:clamp(d,1,t);return render()}
  if(b.dataset.client){S.detail=b.dataset.client;S.detailDay=null;render();window.scrollTo(0,0);return}
  if(act==="back"){S.detail=null;return render()}
  if(b.dataset.hday){S.detailDay=Number(b.dataset.hday);return render()}
  if(b.dataset.filter){S.filter=b.dataset.filter;return render()}
  if(b.dataset.sort){const k=b.dataset.sort;S.sort=S.sort.k===k?{k,dir:-S.sort.dir}:{k,dir:k==="name"||k==="status"||k==="last"?1:-1};return render()}
  if(act==="send-note"){const v=root.querySelector("#coachNote").value.trim();const all=store.get(K.notes,{});all[b.dataset.c]={text:v,at:Date.now()};store.set(K.notes,all);toast(v?"Note sent":"Note cleared");return render()}
  if(act==="save-weeks"){
    root.querySelectorAll("[data-w]").forEach(el=>{const w=WEEKS[el.dataset.w],f=el.dataset.f;w[f]=(f==="water"||f==="steps")?Number(el.value)||0:el.value});
    store.set(K.weeks,WEEKS);for(const k in GEN)delete GEN[k];toast("Saved");return render();
  }
  if(act==="reset-weeks"){WEEKS=DEFAULT_WEEKS.map(w=>({...w}));store.set(K.weeks,null);for(const k in GEN)delete GEN[k];toast("Defaults restored");return render()}

  // client task controls
  const row=b.closest("[data-k]");if(!row)return;const k=row.dataset.k;
  if(b.dataset.type==="check"){const on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on);return commit(k,on)}
  if(b.dataset.rate){const v=Number(b.dataset.rate),cur=b.getAttribute("aria-pressed")==="true";return commit(k,cur?"":v,true)}
  if(b.dataset.water){const x=ctx(),cur=Number((logsFor(me())[x.date]||{}).water)||0;return commit(k,Math.max(0,Math.round((cur+Number(b.dataset.water))*2)/2),true)}
  if(b.dataset.mtag){const on=b.getAttribute("aria-pressed")!=="true";return commit(k+"_"+b.dataset.mtag,on,true,k)}
  if(b.dataset.multi){const x=ctx(),cur=resetsOf((logsFor(me())[x.date]||{})[k]),o=b.dataset.multi;return commit(k,cur.includes(o)?cur.filter(z=>z!==o):[...cur,o],true)}
  if(b.dataset.opt){const cur=b.getAttribute("aria-pressed")==="true";return commit(k,cur?"":b.dataset.opt,true)}
});
root.addEventListener("keydown",e=>{const tr=e.target.closest("tr[data-client]");if(tr&&(e.key==="Enter"||e.key===" ")){e.preventDefault();tr.click()}});

let timers={};
root.addEventListener("input",e=>{
  const row=e.target.closest("[data-k]");if(!row||!ctx())return;const k=row.dataset.k;
  if(e.target.type==="file")return;
  let v=e.target.value;if(e.target.type==="number")v=v===""?"":Number(v);
  if(k==="full_steps"){const wk=weekOf(ctx().dn),n=Number(v)||0;const bar=row.querySelector(".bar i");if(bar)bar.style.width=Math.min(100,n/wk.steps*100)+"%";const lv=row.querySelector('[data-live="steps"]');if(lv)lv.textContent=`${n.toLocaleString("en-GB")} / ${wk.steps.toLocaleString("en-GB")} (${splitSteps(wk.steps).map(x=>x.toLocaleString("en-GB")).join(" + ")})`}
  clearTimeout(timers[k]);timers[k]=setTimeout(()=>commit(k,v),300);
});
root.addEventListener("change",e=>{
  const row=e.target.closest("[data-k]");if(!row||!ctx())return;const k=row.dataset.k;
  if(e.target.type==="file"){const f=e.target.files&&e.target.files[0];if(f)commit(k,f.name,true);return}
  if(e.target.type==="time"){clearTimeout(timers[k]);commit(k,e.target.value,true)}
});

render();
})();
</script>
