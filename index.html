<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Project Reset App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky brand bar + tab row; one centred column for clients, wide grid for the coach. Single light look by choice: white base, GrowLikeVines neon green, black for weight. */
:root{
  color-scheme: light;
  --bg:#ffffff;
  --surface:#f6f8f5;
  --surface-2:#e9eee7;
  --line:#dfe5dc;
  --fg:#0a0b0a;
  --muted:#626a60;
  --lime:#39e81f;
  --lime-dim:#39e81f1f;
  --pale:#eefbe8;
  --done-bg:#e4e7e2;
  --done-fg:#8d948a;
  --g-track:#2e322b;
  --green-ink:#14861a;
  --night:#0a0b0a;
  --on-night:#f2f5f1;
  --ink:#0a0b0a;
  --ok:#14861a;
  --warn:#a86a00;
  --bad:#d4371f;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:Montserrat,"Helvetica Neue",Arial,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.55;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green-ink);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:760px;margin:0 auto}
.wide{max-width:1180px;margin:0 auto}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.display{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.92}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* Wordmark */
.mark{display:inline-flex;flex-direction:column;line-height:.8;font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;color:var(--fg)}
.mark span:last-child{background:var(--lime);color:var(--ink);padding:0 .12em;align-self:flex-start;margin-top:.04em}
.mark.sm{font-size:19px}
.mark.lg{font-size:clamp(54px,14vw,84px);transform:skew(-4deg)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);box-shadow:0 1px 0 var(--lime)}
.top-in{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{background:var(--lime);color:var(--ink)}
.who{display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:12px}
.link{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:4px}
.link:hover{color:var(--fg)}
.proto{font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);padding:3px 7px;border-radius:999px;font-weight:600}

main{padding-block:24px 64px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:11px 16px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--surface-2)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.4;cursor:default}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding-block:48px}
.login-card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:22px}
.login-card form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.input:focus{border-color:var(--green-ink);outline:none}
.login-hero{background:var(--night);border-radius:18px;padding:28px 24px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 0 0 1px var(--night),0 18px 50px -18px var(--lime);background-image:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--lime) 22%,transparent),transparent 60%)}
.login-hero .mark span:first-child{color:var(--on-night)}
.login-hero p{color:var(--on-night);font-weight:600}
.demo-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.demo-row .btn.primary{grid-column:1/-1}
.welcome{background:var(--night);color:var(--on-night);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:8px;box-shadow:0 14px 40px -18px var(--lime)}
.welcome .eyebrow{color:var(--lime)}
.welcome .display{color:var(--lime)}
.demo-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px dashed var(--warn);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--warn)}
.demo-bar .chip{border-color:var(--warn);color:var(--warn);background:var(--bg)}
.note{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}

/* Cards and sections */
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.sec-title{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.02em}

/* Today header */
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:16px}
.dayno{font-size:clamp(64px,16vw,96px);color:var(--fg)}
.dayno small{font-size:.4em;color:var(--muted);margin-left:6px;font-style:italic}
.ring{flex:none;position:relative;width:96px;height:96px}
.ring svg{display:block}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:28px;font-weight:700;font-style:italic}
.daynav{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip:disabled{opacity:.35;cursor:default}
.theme{background:var(--night);color:var(--lime);box-shadow:inset 0 0 0 1px var(--night),0 10px 30px -12px var(--lime);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.theme .eyebrow{color:var(--on-night);opacity:.7}
.theme .display{font-size:clamp(30px,8vw,42px)}
.targets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.target{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.target b{font-family:var(--display);font-size:24px;font-weight:700;line-height:1}
.sticky{background:var(--surface);border-left:4px solid var(--lime);border-radius:0 var(--r) var(--r) 0;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.coachnote{border:1px solid var(--green-ink);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;background:var(--lime-dim)}

/* Task rows */
.tasks{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .lbl{flex:1;min-width:0;display:flex;flex-direction:column}
.row .lbl strong{font-weight:600}
.row .lbl small{color:var(--muted);font-size:12px}
.row.done .lbl strong{color:var(--fg)}
.tick{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:transparent;transition:background .15s,border-color .15s}
.row.done .tick{background:var(--lime);border-color:var(--lime)}
.tick svg{opacity:0}
.row.done .tick svg{opacity:1}
button.row{background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;color:inherit}
.row.stacked{flex-direction:column;align-items:stretch;gap:10px}
.row.stacked .top-line{display:flex;align-items:center;gap:14px}
.rating{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rating button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 0;font-weight:700;font-size:13px}
.rating button[aria-pressed="true"]{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.ctrl{width:150px;flex:none}
.ctrl.time{width:120px}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.badge.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.badge.miss{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);border-radius:99px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:18px;line-height:1}
.stepper b{font-family:var(--display);font-size:24px;min-width:58px;text-align:center}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button[aria-pressed="true"]{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.upload{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
textarea.input{min-height:84px;resize:vertical}
.more{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.more button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.more button:hover{border-color:var(--green-ink)}
.more small{color:var(--muted);font-size:12px}

/* Programme content */
.hero-p{display:flex;flex-direction:column;gap:10px;padding-block:8px 6px}
.hero-p .display{font-size:clamp(44px,11vw,72px)}
.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.acc summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.acc summary::-webkit-details-marker{display:none}
.acc summary h3{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.02em}
.acc summary .plus{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;transition:transform .2s}
.acc[open] summary .plus{transform:rotate(45deg);border-color:var(--lime);background:var(--lime);color:var(--ink)}
.acc .body{padding:0 18px 20px;display:flex;flex-direction:column;gap:12px;max-width:68ch}
.acc .body h4{margin:6px 0 0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--green-ink)}
.acc .body ul,.acc .body ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.acc .body blockquote{margin:0;padding:12px 14px;border-left:4px solid var(--lime);background:var(--surface);border-radius:0 10px 10px 0;font-weight:600}
.reset-letters{display:grid;gap:8px}
.reset-letters div{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.reset-letters b{font-family:var(--display);font-style:italic;font-size:40px;line-height:.9;color:var(--green-ink)}
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px}
.tool b{font-family:var(--display);font-size:22px;text-transform:uppercase;font-weight:700}
.tool small{color:var(--muted)}

/* Progress */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat .cell{aspect-ratio:1;max-width:100%;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.heat .cell.l1{background:color-mix(in srgb,var(--lime) 18%,var(--surface));color:var(--fg)}
.heat .cell.l2{background:color-mix(in srgb,var(--lime) 45%,var(--surface));color:var(--fg)}
.heat .cell.l3{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.heat .cell.future{background:transparent;border-style:dashed;opacity:.5}
.heat .cell.today{outline:2px solid var(--fg);outline-offset:1px}
.heat .cell.sel{outline:2px solid var(--green-ink);outline-offset:2px}
button.cell{cursor:pointer}
.heat-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:11px;color:var(--muted);text-align:center;margin-bottom:6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
/* non negotiables */
.nn-group{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.nn-group:first-of-type{border-top:0;padding-top:4px}
.nn-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nn-head .pl{font-family:var(--display);font-style:italic;font-weight:800;font-size:30px;line-height:.8;color:var(--green-ink);width:20px}
.nn-head b{font-family:var(--display);font-size:20px;text-transform:uppercase;font-weight:700;letter-spacing:.02em}
.nn-head .num{color:var(--muted);font-size:13px}
.nn-head .all{margin-left:auto;font-size:12px;padding:5px 10px}
.nn-chips{display:flex;flex-wrap:wrap;gap:6px}
.nn-chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--fg)}
.nn-chip[aria-pressed="true"],.nn-chip.kept{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.nn-chip.auto{border-style:dashed;cursor:help;background:var(--surface)}
.nn-chip.auto.kept{border-style:solid;background:var(--lime-dim);border-color:var(--lime)}
.nn-chip.miss{color:var(--muted)}
.nn-chip small{font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.65;font-weight:700}
.nn-week{display:flex;flex-direction:column;gap:6px;font-size:13px;background:var(--surface);border-radius:10px;padding:10px 12px}
.nn-week .top-line{display:flex;justify-content:space-between;gap:10px}
.nn-key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.nn-key .nn-chip{padding:2px 8px;font-size:11px;pointer-events:none}
.nn-tags{padding-left:42px;gap:5px}
.nn-tag{padding:4px 10px;font-size:12px;background:var(--bg);border-style:dashed}
.nn-tag[aria-pressed="true"]{border-style:solid}
.row-btn{display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;width:100%;text-align:left;color:inherit;min-width:0}
.dt-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dt-opt{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px}
.dt-opt b{font-family:var(--display);font-size:24px;text-transform:uppercase;font-style:italic;font-weight:800;line-height:1}
.dt-opt small{color:var(--muted);font-size:12px}
.dt-opt[aria-pressed="true"]{background:var(--night);border-color:var(--night);color:var(--lime);box-shadow:0 8px 24px -12px var(--lime)}
.dt-opt[aria-pressed="true"] small{color:var(--on-night);opacity:.75}
.daytype:has(.dt-opt[aria-pressed="true"]) .dt-opt:not([aria-pressed="true"]) b{font-size:18px}
.ringwrap{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.nnsum{font-size:11px;color:var(--muted);text-align:center;line-height:1.2;max-width:110px}
.nnsum b{display:block;font-family:var(--display);font-size:20px;color:var(--fg)}
.pillar-sum{display:flex;gap:14px;align-items:center;min-width:0}
.pillar-sum .pl{font-family:var(--display);font-style:italic;font-weight:800;font-size:48px;line-height:.8;color:var(--green-ink);flex:none}
.pillar-sum small{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:2px}
.nn-item{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.nn-item-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.how{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.how.auto{background:var(--lime-dim);color:var(--green-ink)}
.how.tap{background:var(--fg);color:var(--bg)}
.hview{display:flex;gap:6px;margin-bottom:10px}
.hview button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.habit .pl{color:var(--green-ink);font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-right:2px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile b{font-family:var(--display);font-size:36px;line-height:1;font-weight:700}
.tile small{color:var(--muted);font-size:12px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.keyrow{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.keyrow i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

/* Coach */
.coach-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:13px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface)}
th button{background:none;border:0;padding:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit}
th button[data-active="true"]{color:var(--green-ink)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.mini{display:inline-flex;gap:2px;vertical-align:middle}
.mini i{width:8px;height:18px;border-radius:2px;background:var(--surface-2)}
.mini i.l1{background:color-mix(in srgb,var(--lime) 25%,var(--surface-2))}
.mini i.l2{background:color-mix(in srgb,var(--lime) 55%,var(--surface-2))}
.mini i.l3{background:var(--lime)}
.habit{display:grid;grid-template-columns:150px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.habit .bar i.low{background:var(--bad)}
.habit .bar i.mid{background:var(--warn)}
.detail-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.detail-head .display{font-size:clamp(40px,9vw,64px)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.log-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}
.log-list div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;min-width:0}
.log-list div span:last-child{text-align:right;overflow-wrap:anywhere}
.log-list .miss span:last-child{color:var(--muted)}
.weeks-tbl table{min-width:820px}
.weeks-tbl td{vertical-align:top}
.weeks-tbl .input{padding:8px 10px;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--lime);color:var(--ink);font-weight:700;padding:10px 16px;border-radius:999px;font-size:13px;z-index:20}

/* phases + steps + day list */
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:4}
.phase-tab{border:0;background:none;border-radius:10px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:700;font-size:14px;color:var(--fg)}
.phase-tab small{font-size:11px;color:var(--muted);font-weight:600}
.phase-tab[aria-current="page"]{background:var(--night);color:var(--lime)}
.phase-tab[aria-current="page"] small{color:var(--on-night);opacity:.75}
.phase-tab.complete:not([aria-current="page"]) small{color:var(--green-ink)}
.goal{display:flex;flex-direction:column;gap:4px}
.steps-list{display:flex;flex-direction:column;gap:12px}
.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.step.locked{opacity:.55}
.step.current{border-color:var(--green-ink);box-shadow:0 0 0 3px var(--lime-dim);background:var(--bg)}
.step-num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-style:italic;font-weight:800;font-size:22px;background:var(--surface-2)}
.step.current .step-num{background:var(--night);color:var(--lime)}
.step.done .step-num{background:var(--lime)}
.step-body{display:flex;flex-direction:column;gap:12px;min-width:0}
.step-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step-head h3{font-family:var(--display);font-size:24px;text-transform:uppercase;font-weight:700;line-height:1}
.draft{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--warn);border:1px dashed currentColor;border-radius:999px;padding:1px 7px}
.ask{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;min-width:0}
.step-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stamp{font-weight:700;font-variant-numeric:tabular-nums;background:var(--lime-dim);color:var(--green-ink);padding:3px 9px;border-radius:999px;font-size:12px;white-space:nowrap}
.direction{background:var(--night);color:var(--on-night);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.direction .eyebrow{color:var(--lime)}
.direction small{opacity:.8}
.locked-day{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-block:32px}
.lockbig{width:52px;height:52px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.lockbig svg{width:22px;height:22px}
.items{display:flex;flex-direction:column}
.item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item-tick{background:none;border:0;padding:0;flex:none}
.item-tick .tick{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center}
.item-tick .tick svg{opacity:0}
.item.done .item-tick .tick{background:var(--lime);border-color:var(--lime)}
.item.done .item-tick .tick svg{opacity:1}
.item-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.item-title{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600;padding-top:3px}
.item-title>span:first-child{overflow-wrap:anywhere}
.kind{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.fu{background:var(--night);color:var(--on-night);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;margin-top:4px}
.fu .chip{background:var(--bg);color:var(--fg);border-color:var(--bg)}
.fu .chip[data-val="1"]{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.x{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px}
.x:hover{color:var(--bad)}
.composer{display:flex;gap:8px;margin-top:10px}
.composer .input{flex:1}
.chip.add{background:var(--bg)}
.senses{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.sense{border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;font-size:12px;font-weight:600;background:var(--bg)}
.sense b{font-family:var(--display);font-size:20px;line-height:1;color:var(--muted)}
.sense.on{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.sense.on b{color:var(--ink)}
.nn-item{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.log-phase{display:flex;flex-direction:column;margin-top:14px}
.log-phase:first-of-type{margin-top:4px}
.log-phase h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--green-ink);margin:0 0 4px}
.lp-row{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:3px}
.lp-top{display:flex;justify-content:space-between;gap:12px}
.lp-row.miss .lp-top{color:var(--muted)}
.lp-ans{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px}
.lp-ans span{overflow-wrap:anywhere}
.kindrow{padding:8px 0;border-top:1px solid var(--line)}
.kindrow:first-of-type{border-top:0}
.kind-h{display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px}
.nextbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border:2px solid var(--night);border-radius:var(--r);padding:16px 18px;background:var(--bg)}
.nextbar p{color:var(--muted);font-size:13px}
.nextbar .btn{flex:none}
.scorecard{background:var(--night);color:var(--on-night);border-radius:18px;padding:22px 22px 24px;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 50px -18px var(--lime);background-image:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--lime) 18%,transparent),transparent 60%)}
.scorecard .eyebrow{color:var(--lime)}
.sc-big{display:flex;align-items:flex-end;gap:14px}
.sc-big b{font-family:var(--display);font-style:italic;font-weight:800;font-size:clamp(96px,26vw,140px);line-height:.8;color:var(--lime)}
.sc-big span{font-family:var(--display);font-size:28px;text-transform:uppercase;font-weight:700;line-height:1;padding-bottom:6px}
.sc-big small{font-family:var(--body);font-size:13px;text-transform:none;font-weight:500;opacity:.75}
.sc-diff{align-self:flex-start;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--on-night) 12%,transparent)}
.sc-diff.up{color:var(--lime)}
.sc-parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sc-part{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.sc-part span{font-size:12px;color:var(--muted);font-weight:600}
.sc-part b{font-family:var(--display);font-size:30px;line-height:1}
.sc-part small{font-size:16px;color:var(--muted)}
.tile small+small{margin-top:2px}
.sc-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
.sc-tiles .tile b{font-size:clamp(24px,7vw,36px)}
.sc-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sc-num{display:flex;flex-direction:column;gap:3px;align-items:flex-start;font-size:12px}
.sc-num b{font-family:var(--display);font-size:26px;line-height:1}
.brain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.notice{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.notice-q{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green-ink)}
.notice .chip{padding:4px 10px;font-size:12px;background:var(--bg)}
.notice .input{padding:8px 10px;font-size:13px}
.item .notice{margin-top:4px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.tl li:first-child{border-top:0}
.tl-t{font-weight:700;color:var(--green-ink)}
.tl-b{display:flex;flex-direction:column;gap:3px;min-width:0}
.tl-n{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.feel{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--lime-dim);color:var(--green-ink)}
.tl-n q{font-style:italic;color:var(--fg);overflow-wrap:anywhere}
details.raw{margin-top:12px}
details.raw summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--muted)}
.review,.todo-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:2px 12px}
.todo-list:empty{display:none}
.rv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-weight:500}
.rv:first-child{border-top:0}
.rv.done span:first-child{color:var(--green-ink)}
.rv .chip{padding:4px 10px;font-size:12px;flex:none}
.item.meal .input{padding:8px 10px;font-size:14px}
.item.meal .meal-tags .chip{padding:4px 10px;font-size:12px}
details.moreopts{margin-top:12px}
details.moreopts summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--green-ink)}
@media (max-width:560px){.brain{grid-template-columns:repeat(2,minmax(0,1fr))}}

.pblock.open{display:flex;flex-direction:column;gap:14px;background:var(--pale);border:2px solid var(--lime);border-radius:22px;padding:18px;box-shadow:0 14px 40px -24px var(--green-ink)}
.pblock.open.done{background:var(--surface);border-color:var(--line);box-shadow:none}
.pblock.open .card,.pblock.open .step:not(.current),.pblock.open .nextbar{background:var(--bg)}
.pblock.open .step.locked{background:color-mix(in srgb,var(--bg) 70%,var(--pale))}
.pb-head{display:flex;align-items:flex-start;gap:14px}

.pblock.done .pb-num{background:var(--lime);color:var(--ink)}
.pb-sum{display:flex;align-items:center;gap:18px;width:100%;min-height:120px;text-align:left;border-radius:22px;padding:22px 20px}

.pblock.done .pb-sum .pb-num{width:68px;height:68px;background:var(--lime);color:var(--ink)}
.pblock.done .pb-sum .pb-num svg{width:36px;height:36px}
.pblock.upcoming .pb-sum,.pblock.skipped .pb-sum{background:var(--bg);border:2px dashed var(--line);color:var(--muted);opacity:.55}
.pblock.upcoming .pb-num,.pblock.skipped .pb-num{width:68px;height:68px;background:var(--surface);color:var(--muted)}
.pblock.upcoming .pb-num svg{width:24px;height:24px}
.pairs{display:flex;flex-direction:column;gap:10px}
.plan-slots{display:flex;flex-direction:column;gap:8px}
.role{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--night);color:var(--lime);padding:2px 7px;border-radius:999px;vertical-align:2px;margin-left:4px}
.train-place{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:600}
.train-place .chip{padding:4px 10px;font-size:12px}
.train-place small{font-size:12px;font-weight:500}
.plan-train{display:flex;align-items:center;gap:12px;padding:8px 12px;border:2px solid var(--night);border-radius:12px;background:var(--night);color:var(--on-night);font-size:13px}
.plan-train .plan-n{background:var(--lime);color:var(--ink);font-style:normal;font-size:14px}
.train-row{border:2px solid var(--night)}

.train-row .muted{color:var(--on-night);opacity:.7}

.plan-slot{border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}

.plan-x{font-size:12px;font-weight:700;color:var(--green-ink);flex:none}
.mealopen{align-self:flex-start;padding:2px 0;font-weight:700;color:var(--green-ink);font-size:13px}
.picker{display:flex;flex-direction:column;gap:10px}

.pick-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.fcats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.fcat{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:700;font-size:12px;color:var(--fg)}

.fsum{display:flex;flex-direction:column;gap:2px;font-size:13px}
.gauge-dock{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}

.togo{font-size:11px;font-weight:700;color:var(--warn)}

<body>
<div id="root"></div>

<script>
(function(){
"use strict";

/* ---------- storage (per browser, demo only) ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const K={session:"pr3_session",edits:"pr3_edits",notes:"pr3_notes",weeks:"pr3_weeks",fresh:"pr3_fresh"};
try{["pr1_session","pr1_edits","pr1_notes","pr1_weeks","pr2_session","pr2_edits","pr2_notes","pr2_weeks"].forEach(k=>localStorage.removeItem(k))}catch(e){}

/* ---------- dates ---------- */
const DAY=86400000;
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const diffDays=(a,b)=>Math.round((b-a)/DAY);
const NOW=new Date();
const TODAY=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
const COHORT=addDays(TODAY,-((TODAY.getDay()+6)%7)-7); // Monday of last week, so the demo is always mid-programme
const fmtLong=d=>d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
const fmtShort=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const mins=t=>{if(!t)return null;const[h,m]=t.split(":").map(Number);return h*60+m};
const hhmm=m=>{m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+":"+pad(m%60)};
const PROGRAMME_DAYS=28;

/* ---------- programme config (coach's number setter) ---------- */
const DEFAULT_WEEKS=[
  {theme:"Build the baseline",note:"Same wake time, same bed time, every day this week. Your nervous system trusts what it can predict. Give it something to predict.",steps:10000,water:6,protein:160},
  {theme:"Make it the default",note:"Stress, poor sleep & poor recovery all lower the oxygen reaching your cells. Less oxygen means every task costs you more energy. Settle those first & the same day costs you less.",steps:10000,water:6,protein:160},
  {theme:"Raise the floor",note:"Your worst day this week should still beat your best day before you started. Protect the minimum, the rest follows.",steps:10000,water:6,protein:160},
  {theme:"Own the standard",note:"Nobody is checking anymore except you. This is the week the habits stop being tasks and become who you are.",steps:10000,water:6,protein:160}
];
let WEEKS=(store.get(K.weeks,null)||DEFAULT_WEEKS).map(w=>({...DEFAULT_WEEKS[0],...w}));

/* ---------- senses (draft mapping until Ellis's senses key arrives) ---------- */
const SENSES=[["sight","Sight"],["sound","Sound"],["smell","Smell"],["taste","Taste"],["touch","Touch"]];
const RESET_TOOLS=[
  ["Breathwork",["smell","touch"]],["Meditation",["sound"]],["Breath movement",["touch"]],["Nasal walk",["sight","sound","smell"]],
  ["Heat",["touch"]],["Massage",["touch"]],["Cold therapy",["touch"]],["Time out",["sight","sound"]],
  ["Journalling",["sight","touch"]],["Grounding",["touch","sight"]],["Sun exposure",["sight","touch"]],["Brain training",["sight"]]
];
const resetSenses=n=>(RESET_TOOLS.find(r=>r[0]===n)||[0,[]])[1];

/* ---------- the 3 phases ---------- */
// Morning: stimulation & arousal. Day: keep energy stable. Evening: reduce arousal.
const PHASES=[
  {id:"morning",name:"Morning",goal:"Stimulation & arousal",intro:"Wake up, raise it, bring it down, Meal 1, check in. Five steps, in order, before the day opens."},
  {id:"day",name:"Day",goal:"Keep energy stable",intro:"Keep it simple: each meal, then a walk block straight after it."},
  {id:"evening",name:"Evening",goal:"Reduce arousal",intro:"Review today, then build tomorrow. Three steps, in order."}
];
// Morning brain targets (from Ellis's Loom: the morning action should hit all of these)
const BRAIN=[["motor","Motor cortex"],["brainstem","Brainstem arousal"],["basal","Basal ganglia"],["circadian","Circadian rhythm"]];
const ACTIONS=[["Fast walk outside",["motor","brainstem","basal"]],["Run or jog",["motor","brainstem","basal"]],["Cold air or cold water",["brainstem"]],["Music on before leaving",["brainstem"]],["Bright lights on",["brainstem"]],["Sunlight on your eyes",["circadian"]]];
const LOWER=["Wim Hof","Slow breathwork","Meditation","Breath movement"];
const NEXT=[["neurosim","Brain training (NeuroSim)"],["beach","Beach or nature walk"],["eat","Eat, I'm hungry now"],["work","Straight to work"]];
const FEELS=["Wired","Flat","Settled","Connected","Emotional","Hungry","Clear head","Weakness creeping in"];
// Approved foods from the meal plans. Veg & fat are open at every meal, carbs from Meal 2 (none at Meal 1).
const FOOD_CATS=[
  {k:"protein",name:"Protein",from:1,items:["Whole eggs","Greek yoghurt","Cottage cheese","Smoked salmon","Whey isolate","Turkey bacon","Chicken breast","Chicken thigh","Turkey","Oily fish","White fish","Tuna","Shellfish","Beef 5% mince","Beef steak","Lamb","Protein yoghurt","Biltong","Fresh pasteurised cow's milk"]},
  {k:"fruit",name:"Fruit",from:1,items:["Strawberries","Blueberries","Raspberries","Blackberries","Orange","Banana","Kiwi","Apple","Pear","Grapes","Pineapple","Mango","Melon","Peach","Grapefruit","Pomegranate","Fresh orange juice"]},
  {k:"veg",name:"Veg",from:1,items:["Mixed leaves","Spinach","Kale","Broccoli","Peppers","Cucumber","Tomatoes","Mushrooms","Kimchi","Sauerkraut","Asparagus","Green beans","Baby carrots","Spring onions","Soup or broth"]},
  {k:"fat",name:"Fat",from:1,items:["Avocado","Nuts","Seeds","Nut butter","Hummus","Cheese","Olive oil","Organic butter","Olives","Kefir","Dark chocolate","Duck fat","Coconut oil"]},
  {k:"carbs",name:"Carbs",from:2,items:["Rice","Potato","Gluten free oats","Rice cakes","Chickpeas","Couscous","Sourdough bread","Cream of rice","Honey","Rice Krispies"]}
];
const MAX_MEALS=5;
const foodsCount=f=>f?FOOD_CATS.reduce((a,c)=>a+((f[c.k]||[]).length),0):0;
const foodsSummary=f=>f?FOOD_CATS.map(c=>(f[c.k]||[])).flat().join(", "):"";
function foodPicker(key,slot,foods,dis){
  const f=foods||{},cur=(S.fcat[key])||"protein";
  return `<div class="picker">
    <div class="fcats" role="tablist">${FOOD_CATS.map(c=>{const n=(f[c.k]||[]).length,off=slot<c.from;return `<button class="fcat${cur===c.k?" on":""}${off?" off":""}" data-fcat="${key}" data-val="${c.k}" ${dis||off?"disabled":""} aria-pressed="${cur===c.k}"><span>${c.name}</span><small class="num">${off?"From Meal "+c.from:n?n+" picked":"–"}</small></button>`}).join("")}</div>
    ${FOOD_CATS.filter(c=>c.k===cur).map(c=>`<div class="opts fopts">${c.items.map(it=>`<button class="chip" data-food="${key}" data-fc="${c.k}" data-val="${esc(it)}" aria-pressed="${(f[c.k]||[]).includes(it)}" ${dis?"disabled":""}>${esc(it)}</button>`).join("")}</div>`).join("")}
    ${slot===1?`<p class="muted" style="font-size:12px">No carbs at Meal 1. Carbs open from Meal 2.</p>`:""}
  </div>`;
}
const NN_LIST=["Walk before Meal 1","Steps spread through the day","Morning sunlight","Evening walk & moonlight","Breathwork","Protein every meal","Fruit & veg every meal","Water & salt","No caffeine after 1pm","Reset every 90 mins","Phone off 1hr before bed"];
const MEAL1_TAGS=["Protein","Fruit / veg","No carbs","No added sugar"];
// Workout library (from the Evolve page). The PDFs get attached to these.
const WORKOUTS=[["Gym (female)",["Female PDF 1","Female PDF 2","Female PDF 3","Female PDF 4","Female PDF 5"]],["Gym (male)",["Male PDF 1","Male PDF 2","Male PDF 3","Male PDF 4","Male PDF 5"]],["Home",["Home PDF 1","Home PDF 2","Home PDF 3","Home PDF 4","Home PDF 5"]]];
const MORNING=[
  {id:"m1",title:"Wake up",text:"Up at your alarm. Tap the button the moment you're out of bed and we'll log it next to the alarm you set.",asks:[]},
  {id:"m2",title:"Arousal activity",text:"Fast & outside, straight from waking. Lights on, music on, out the door and move with pace.",
   asks:[{k:"m_action",type:"pick",label:"Your activity",options:ACTIONS.map(a=>a[0]),req:l=>(l.m_action||[]).length>0,reqMsg:"Pick your activity"}]},
  {id:"m3",title:"Bring it down",text:"Straight after, lower your arousal again. Stay wired and you disconnect. Settle until you can feel something.",
   asks:[{k:"m_lower",type:"pick",multi:true,label:"How you're bringing it down",options:LOWER,req:l=>(l.m_lower||[]).length>0,reqMsg:"Pick how you brought it down"}]},
  {id:"mm",title:"Meal 1",text:"Meal 1 is non-negotiable and part of your morning: within 90 minutes of waking, protein first, no carbs. Eat what you planned last night, tap Change only if you swapped anything.",
   asks:[{k:"_meal1",type:"meal1"},{k:"meal1_water",type:"choice",label:"Did you have water with it?",options:[["yes","Yes"],["no","No"]],req:l=>!!l.meal1_water,reqMsg:"Answer the water question"}]},
  {id:"m4",title:"Morning check-in",text:"Where are you at so far? Log your steps, protein and water and see what's left against today's targets.",
   asks:[{k:"steps",type:"number",label:"Steps so far",target:"steps",remaining:true},{k:"protein",type:"number",label:"Protein so far (g)",target:"protein",remaining:true},{k:"water",type:"number",label:"Water so far (L)",target:"water",step:0.5,remaining:true}]}
];
const ML=5;
const brainHit=log=>{const b=new Set();if(log.m2)(Array.isArray(log.m_action)?log.m_action:[]).forEach(a=>((ACTIONS.find(x=>x[0]===a)||[0,[]])[1]).forEach(k=>b.add(k)));return b};
const EVENING=[
  {id:"e1",title:"Review your day",text:"Check your final numbers against your targets, then rate your day honestly.",
   asks:[{k:"steps",type:"number",label:"Full steps",target:"steps"},{k:"protein",type:"number",label:"Protein (g)",target:"protein"},{k:"water",type:"number",label:"Water (L)",target:"water",step:0.5},{k:"day_rating",type:"rating",label:"Self-assessment: how did today go? 1 to 10"}]},
  {id:"e2",title:"Non-negotiables & wind down",text:"Tick every non-negotiable you kept today. Then phone off and use one Reset tool to bring your arousal down.",
   asks:[{k:"nn_kept",type:"multi",label:"Non-negotiables you kept today",options:NN_LIST.map(x=>[x,x])},{k:"pm_tool",type:"choice",label:"Wind down tool",options:RESET_TOOLS.map(r=>[r[0],r[0]])},{k:"pm_state",type:"rating",label:"How do you feel tonight? 1 to 10"}]},
  {id:"e3",title:"Set up tomorrow",text:"Plan tomorrow so all you have to do is follow it: wake time, your morning activities, training, meals and your to-do list. Then bank the one thing worth remembering and brain dump the rest.",
   asks:[{k:"tmr_wake",type:"time",label:"Alarm for tomorrow"},{k:"tmr_action",type:"pick",label:"Tomorrow's arousal activity: one, straight from waking",options:ACTIONS.map(a=>a[0]),req:l=>(l.tmr_action||[]).length>0,reqMsg:"Pick tomorrow's arousal activity"},{k:"tmr_lower",type:"pick",multi:true,label:"Then bring it down with: pick as many as you like",options:LOWER,req:l=>(l.tmr_lower||[]).length>0,reqMsg:"Pick how you'll bring it down"},{k:"tmr_train",type:"choice",label:"Is tomorrow a training day?",options:[["yes","Yes"],["no","No"]],req:l=>!!l.tmr_train,reqMsg:"Say if tomorrow is a training day"},{k:"tmr_train_time",type:"time",label:"What time will you train?",when:l=>l.tmr_train==="yes",req:l=>!!l.tmr_train_time,reqMsg:"Add your training time"},{k:"tmr_workout",type:"select",label:"Which workout?",when:l=>l.tmr_train==="yes",groups:WORKOUTS,req:l=>!!l.tmr_workout,reqMsg:"Pick your workout"},{k:"meals_tmr",type:"mealplan",label:"Tomorrow's meals"},{k:"todo_tmr",type:"todo",label:"Your own to-do list (extra)"},{k:"plan",type:"textarea",label:"Plan of action for tomorrow"},{k:"bank",type:"textarea",label:"One thing to bank for tomorrow"},{k:"dump",type:"textarea",label:"Brain dump"}]}
];
// Day 0: the setup night after a new client signs up. Same step ids, so scoring and logs work the same way.
const ZERO=[
  {id:"e1",title:"Your baseline",text:"Your average day right now, before anything changes. Your coach sets your steps, protein and water targets from this. (In the live app this comes in from your sign-up form.)",
   asks:[{k:"base_steps",type:"number",label:"Average steps a day",req:l=>l.base_steps>0,reqMsg:"Add your average steps"},{k:"base_protein",type:"number",label:"Average protein a day (g)",req:l=>l.base_protein>0,reqMsg:"Add your average protein"},{k:"base_water",type:"number",label:"Average water a day (L)",step:0.5,req:l=>l.base_water>0,reqMsg:"Add your average water"},{k:"pm_state",type:"rating",label:"How do you feel tonight? 1 to 10"}]},
  {id:"e2",title:"Plan tomorrow's morning & training",text:"Set your alarm, pick your arousal activity for straight after waking and how you'll bring it down. Then say if you're training and when.",
   asks:[{k:"tmr_wake",type:"time",label:"Alarm for tomorrow",req:l=>!!l.tmr_wake,reqMsg:"Set your alarm"},{k:"tmr_action",type:"pick",label:"Tomorrow's arousal activity: one, straight from waking",options:ACTIONS.map(a=>a[0]),req:l=>(l.tmr_action||[]).length>0,reqMsg:"Pick tomorrow's arousal activity"},{k:"tmr_lower",type:"pick",multi:true,label:"Then bring it down with: pick as many as you like",options:LOWER,req:l=>(l.tmr_lower||[]).length>0,reqMsg:"Pick how you'll bring it down"},{k:"tmr_train",type:"choice",label:"Is tomorrow a training day?",options:[["yes","Yes"],["no","No"]],req:l=>!!l.tmr_train,reqMsg:"Say if tomorrow is a training day"},{k:"tmr_train_time",type:"time",label:"What time will you train?",when:l=>l.tmr_train==="yes",req:l=>!!l.tmr_train_time,reqMsg:"Add your training time"},{k:"tmr_workout",type:"select",label:"Which workout?",when:l=>l.tmr_train==="yes",groups:WORKOUTS,req:l=>!!l.tmr_workout,reqMsg:"Pick your workout"},]},
  {id:"e3",title:"Plan Day 1's meals",text:"Pick the foods for each meal. They'll be waiting in your Day, so all you do is tick them off. Add your own to-do list if you want one.",
   asks:[{k:"meals_tmr",type:"mealplan",label:"Tomorrow's meals"},{k:"todo_tmr",type:"todo",label:"Your own to-do list (extra)"},{k:"plan",type:"textarea",label:"Plan of action for Day 1"}]}
];
const STEPS_OF={morning:MORNING,evening:EVENING};
const eveningSteps=log=>log.zero?ZERO:EVENING;
const mealPlanOf=log=>Array.isArray(log.meals_tmr)?log.meals_tmr:[];
// Tomorrow's meals planned with the food picker: 5 slots, one foods object each
// Training goes after meal N (pre-workout = meal N, post-workout = meal N+1). Auto-placed from wake & training time, adjustable.
// pre-workout = the last meal at least an hour before training (meals assumed every 3.5h from an hour after waking)
function autoTrainAfter(wake,time){const w=mins(wake||"07:00"),t=mins(time||"12:00");return clamp(Math.floor((t-60-(w+60))/210)+1,1,MAX_MEALS-1)}
const estMealTime=(wake,slot)=>hhmm(mins(wake||"07:00")+60+(slot-1)*210);
const planTrainAfter=log=>log.tmr_train==="yes"&&log.tmr_train_time?(log.tmr_train_after||autoTrainAfter(log.tmr_wake,log.tmr_train_time)):0;
const dayTrainAfter=log=>log.train==="yes"?(log.train_after||autoTrainAfter("07:00",log.train_time)):0;
const mealRole=(slot,after)=>!after?"":slot===after?"Pre-workout":slot===after+1?"Post-workout":"";
const planFoodsOf=log=>{const a=Array.isArray(log.plan_foods)?log.plan_foods.slice(0,MAX_MEALS):[];while(a.length<MAX_MEALS)a.push({});return a};
const MEAL_EXAMPLES=["Eggs, spinach, berries","Greek yoghurt, berries, honey","Chicken, rice, greens","Salmon, potatoes, broccoli","Steak, sweet potato, peppers","Protein shake, banana"];

/* ---------- day list options + follow-up (process order) questions ---------- */
const KINDS={
  meal:{name:"Meals",q:"Did you move & breathe before eating, then chew it slowly?",senses:["taste","smell","sight"],
    opts:["Meal: protein + fruit / veg","Meal: protein + fats","Pre workout meal: protein + carbs","Post workout meal: protein + carbs","Snack: fruit + protein"]},
  walk:{name:"Steps",q:"Nose breathing, no podcast or music?",senses:["sight","sound","smell"],
    opts:["Steps block after a meal","Nasal walk outside","Walk before Meal 1"]},
  reset:{name:"Regulation tools",q:"Did you slow your breathing right down through it?",senses:null,opts:RESET_TOOLS.map(r=>r[0])},
  train:{name:"Training",q:"Warmed up 5 to 10 mins first & brought your heart rate down after?",senses:["touch","sound"],
    opts:["Gym workout","Home workout","Mobility routine"]},
  own:{name:"Your task",q:"Did you give it 100%, phone away?",senses:[]}
};
const itemSenses=it=>it.kind==="reset"?resetSenses(it.label):(KINDS[it.kind]||KINDS.own).senses||[];
function direction(log){
  const e=log.energy,t=log.train==="yes";
  const base0={low:"Energy's low. Lead with a Reset & a walk before your first big task, and keep meals on time so you're not running on the CNS.",
    steady:"Energy's steady. Protect it: spread your steps around meals and Reset every 90 minutes.",
    wired:"You're wired. Bring it down before you build: breathwork before tasks, nasal walks, no caffeine after 1pm."}[e];const base="Eat, then walk. Spread your steps around your meals and Reset every 90 minutes.";
  return base+(t?` Training today${log.train_time?" at "+log.train_time:""}: your pre-workout meal goes before it, your post-workout meal after.`:"");
}
function suggestions(log){
  const s=[];
  if(log.train==="yes")s.push(["train","Gym workout"]);
  if(log.energy==="low")s.push(["reset","Breathwork"],["walk","Nasal walk outside"]);
  if(log.energy==="wired")s.push(["reset","Breathwork"],["reset","Meditation"]);
  if(log.energy==="steady")s.push(["walk","Steps block after a meal"]);
  s.push(["own","Hardest task first"]);
  const have=new Set((log.items||[]).map(i=>i.label));
  return s.filter(([,l])=>!have.has(l));
}
const mealTagOpts=log=>["Protein",log.train==="yes"?"Carbs":"Fats, no carbs","Fruit / veg","No added sugar"];

/* ---------- scoring: 1 point per completed step or task ---------- */
const stepsDone=(log,ph)=>STEPS_OF[ph].filter(s=>log[s.id]).length;
const itemsOf=log=>Array.isArray(log.items)?log.items:[];
const mealsOf=log=>Array.isArray(log.meals)?log.meals:[];
const todoOf=log=>Array.isArray(log.todo_tmr)?log.todo_tmr:[];
// The Day is a simple list of non-negotiables: each meal, then a walk block after it. Meal 1 comes from the Morning.
function dayPairs(log){
  const pairs=[];
  mealsOf(log).forEach(m=>pairs.push({key:m.id,slot:m.slot,text:m.text||"",foods:m.foods,done:m.done||"",water:m.fu,walk:m.walk||"",planned:m.planned,fixed:m.slot===1&&!!log.mm}));
  return pairs;
}
function scoreOf(log){
  const meals=mealsOf(log),pairs=dayPairs(log),nn=Array.isArray(log.nn_kept)?log.nn_kept.length:0;
  const m=stepsDone(log,"morning"),e=stepsDone(log,"evening"),ml=meals.filter(x=>x.done).length,wk=pairs.filter(x=>x.walk).length;
  const tr=log.train==="yes"?1:0,td=log.train_done?1:0;
  const pts=m+e+ml+wk+nn+td,max=ML+3+meals.length+pairs.length+NN_LIST.length+tr;
  const ans=pairs.filter(x=>x.done&&x.water!==undefined&&x.water!==null),fuYes=ans.filter(x=>x.water===true).length;
  const pd=pairs.filter(x=>x.done).length;
  const sn=new Set();
  if(log.m2&&(Array.isArray(log.m_action)?log.m_action:[]).length)["sight","sound","smell"].forEach(x=>sn.add(x));
  if(log.m3&&log.m_lower&&log.m_lower.length)["smell","touch"].forEach(x=>sn.add(x));
  if(pd)["taste","smell"].forEach(x=>sn.add(x));
  if(wk)["sight","sound","touch"].forEach(x=>sn.add(x));
  if(td)["touch","sound"].forEach(x=>sn.add(x));
  if(log.e2&&log.pm_tool)resetSenses(log.pm_tool).forEach(x=>sn.add(x));
  return{pts,max,pct:max?Math.round(pts/max*100):0,tr,td,m,e,d:0,n:0,ml,mn:meals.length,pd,pn:pairs.length,wk,nn,fuYes,fuN:ans.length,senses:sn,brain:brainHit(log)};
}
const hasAny=log=>log&&Object.keys(log).length>0;
const nowHHMM=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
const uid=()=>Math.random().toString(36).slice(2,9);

/* ---------- demo clients (sample data) ---------- */
const CLIENTS=[
  {id:"sarah",name:"Sarah Mitchell",offset:0,base:.86,drift:.05},
  {id:"tom",name:"Tom Hughes",offset:0,base:.93,drift:.02},
  {id:"priya",name:"Priya Shah",offset:0,base:.74,drift:.12},
  {id:"dan",name:"Dan Cole",offset:0,base:.72,drift:-.3,gone:2},
  {id:"jess",name:"Jess Martin",offset:0,base:.55,drift:.04},
  {id:"liam",name:"Liam O'Neill",offset:0,base:.84,drift:-.22},
  {id:"chloe",name:"Chloe Evans",offset:0,base:.95,drift:0},
  {id:"marcus",name:"Marcus Reid",offset:7,base:.78,drift:.1}
];
const OWN=["Hardest task first: client proposal","Emails & admin","School run","Prep tomorrow's food","Team call","Gym bag ready","Call Mum","Finish report","Food shop","Clear the inbox"];
const PLANS=["Hardest task first, walk after every meal, gym at 12.","Early meeting, so walk before Meal 1 & prep food tonight.","Rest day. Steps spread out, Reset every 90 mins.","Big work day. Breathwork before each block of work."];
const NOTES_M2=["Wanted to cut it to 2 rounds, not 3. Weakness creeping in, more reason to settle.","Looked at the dog after and felt it. Actually relaxed.","Hungry straight after, wasn't a few minutes before.","Heart rate came right down, head quiet."];
const NOTES_DAY=["Hunger arrived on time for once.","Felt flat before, clearer after.","Rushed it, didn't breathe first.","Noticed the sounds on the walk, not my phone."];

const MEALS_M1=["Eggs, spinach, berries","Greek yoghurt, berries, honey","Omelette, avocado","Smoked salmon, eggs, fruit"];
const MEALS_GEN=["Chicken, rice, greens","Salmon, potatoes, broccoli","Beef chilli, rice","Steak, sweet potato, peppers","Turkey wrap, salad","Cottage cheese, fruit","Prawn stir fry"];
const TODO_GEN=[["own","Hardest task first: client proposal"],["own","Emails & admin"],["own","School run"],["own","Prep tomorrow's food"],["own","Team call"],["own","Finish report"],["own","Food shop"],["walk","Steps block after a meal"],["reset","Breathwork"],["walk","Nasal walk outside"]];
function generated(c){
  if(c.fresh)return {};
  if(GEN[c.id])return GEN[c.id];
  const rng=rngFor(c.id),out={},today=clientDayNum(c),nowM=NOW.getHours()*60+NOW.getMinutes();
  let prevL=null;
  for(let d=1;d<=today;d++){
    const date=ymd(dateOf(c,d)),wk=weekOf(d),isToday=d===today;
    if(c.gone&&d>today-c.gone){prevL=null;continue}
    if(c.id==="sarah"&&isToday)continue; // the demo login fills today in, starting from last night's list
    const p=clamp(c.base+c.drift*(d/14)+(rng()-.5)*.22,.08,.99);
    const L={},pick=a=>a[Math.floor(rng()*a.length)];
    const wake=420+Math.round((rng()-.3)*50*(1.2-p)),until=isToday?nowM:1440;
    let t=wake;
    for(const s of MORNING){if(t>until||rng()>p+.08)break;L[s.id]=hhmm(t);t+=10+Math.round(rng()*25)}
    if(L.m2)L.m_action=prevL&&(prevL.tmr_action||[]).length?prevL.tmr_action:[pick(["Fast walk outside","Fast walk outside","Run or jog"])];
    if(L.m3)L.m_lower=prevL&&(prevL.tmr_lower||[]).length?prevL.tmr_lower:[pick(LOWER)];
    if(L.m4){L.steps=1500+Math.round(rng()*2500);L.protein=Math.round(25+rng()*20);L.water=1}
    if(L.mm)L.meal1_water=rng()<p+.05?"yes":"no";
    L.train=prevL&&prevL.tmr_train?prevL.tmr_train:(rng()<.5?"yes":"no");if(L.train==="yes"){L.train_time=prevL&&prevL.tmr_train_time||"12:00";L.train_after=prevL&&prevL.tmr_train_after||autoTrainAfter("07:00",L.train_time);L.workout=prevL&&prevL.tmr_workout||"Home PDF 1"}
    const meals=[];const nM=3+Math.floor(rng()*3);for(let i=0;i<nM;i++){const f=genFoods(i+1,rng);meals.push({id:uid(),slot:i+1,foods:f,text:foodsSummary(f),planned:!!prevL})};
    let it=Math.max(t,wake+60);
    meals.forEach(x=>{if(x.slot===1){if(L.mm){x.done=L.mm;x.fu=L.meal1_water==="yes";if(rng()<p)x.walk=hhmm(mins(L.mm)+25)}return}it+=150+Math.round(rng()*60);if(L.m4&&it<until&&rng()<p){x.done=hhmm(it);x.fu=rng()<p+.05;if(it+25<until&&rng()<p)x.walk=hhmm(it+25)}});
    if(L.m4&&L.train==="yes"&&mins(L.train_time)<until&&rng()<p){L.train_start=L.train_time;L.train_done=hhmm(mins(L.train_time)+60)}
    if(L.m1)L.meals=meals;
    let et=1230+Math.round(rng()*60);
    for(const s of EVENING){if(et>until||rng()>p+.02)break;L[s.id]=hhmm(et);et+=15+Math.round(rng()*20)}
    if(L.e1){const hit=rng()<p;L.steps=hit?Math.round(wk.steps*(1+rng()*.3)):Math.round(wk.steps*(.4+rng()*.5));L.water=hit?wk.water:Math.round(wk.water*(.5+rng()*.4)*2)/2;L.protein=rng()<p?wk.protein+Math.round(rng()*20):Math.round(wk.protein*(.6+rng()*.3));L.day_rating=Math.round(clamp(3+p*6+(rng()-.5)*3,1,10))}
    if(L.e2){L.nn_kept=NN_LIST.filter(()=>rng()<p);L.pm_tool=pick(["Breathwork","Meditation","Journalling","Heat","Time out"]);L.pm_state=Math.round(clamp(3+p*6+(rng()-.5)*3,1,10))}
    if(L.e3){L.tmr_wake="07:00";L.plan=pick(PLANS);L.tmr_action=[pick(["Fast walk outside","Run or jog"])];L.tmr_lower=[pick(LOWER)];L.tmr_train=rng()<.5?"yes":"no";if(L.tmr_train==="yes"){L.tmr_train_time=pick(["12:00","13:00","17:30","18:30"]);L.tmr_train_after=autoTrainAfter("07:00",L.tmr_train_time);L.tmr_workout=pick(WORKOUTS[pick([0,1,2])][1])}L.plan_foods=[1,2,3,4,5].map(n=>n<=4?genFoods(n,rng):{});L.meals_tmr=L.plan_foods.filter(f=>foodsCount(f)).map(foodsSummary);
      const nx=[];while(nx.length<4){const q=pick(TODO_GEN);if(!nx.some(z=>z[1]===q[1]))nx.push(q)}L.todo_tmr=nx;
      if(rng()<.7)L.bank=pick(BANKS);if(rng()<.6)L.dump=pick(DUMPS)}

  }

}
function logsFor(c){
  const g=generated(c),edits=(store.get(K.edits,{})[c.id])||{},out={};

  for(const d in edits)out[d]={...(out[d]||{}),...edits[d]};
  return out;
}

/* ---------- stats ---------- */
function statsFor(c){
  const logs=logsFor(c),today=clientDayNum(c),days=[];
  for(let d=1;d<=Math.max(1,today);d++){const date=ymd(dateOf(c,d)),wk=weekOf(d),log=logs[date]||{},sc=scoreOf(log);days.push({d,date,wk,log,sc,pct:sc.pct,any:hasAny(log)})}
  const past=days.filter(x=>x.d<today),last7=past.slice(-7),rows=last7.length?last7:days.slice(-1);
  const avg=f=>rows.length?rows.reduce((a,x)=>a+f(x),0)/rows.length:0;
  const avg7=Math.round(avg(x=>x.pct)),pts7=avg(x=>x.sc.pts);
  const morn7=Math.round(avg(x=>x.sc.m===ML?100:0)),eve7=Math.round(avg(x=>x.sc.e===3?100:0));
  const fuA=rows.reduce((a,x)=>a+x.sc.fuN,0),fuY=rows.reduce((a,x)=>a+x.sc.fuYes,0); // water with meals
  const proc7=fuA?Math.round(fuY/fuA*100):null,senses7=avg(x=>x.sc.senses.size);
  let streak=0;const todayRow=days[days.length-1];
  if(todayRow.pct>=70)streak++;
  for(let i=past.length-1;i>=0;i--){if(past[i].pct>=70)streak++;else break}
  let lastLog=null;for(let i=days.length-1;i>=0;i--){if(days[i].any){lastLog=days[i];break}}
  const since=lastLog?today-lastLog.d:today;
  const numAvg=k=>{const v=rows.map(x=>Number(x.log[k])).filter(n=>n>0);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
  let status="ok";if(since>=2||avg7<45)status="bad";else if(avg7<70)status="warn";
  return{c,days,rows,today,todayRow,avg7,pts7,morn7,eve7,proc7,senses7,streak,since,status,
    steps7:numAvg("steps"),protein7:numAvg("protein"),am7:numAvg("am_state"),pm7:numAvg("pm_state")};
}

function ring(p,size=96){

}

function curCtx(){
  const c=me(),today=clientDayNum(c),dn=S.viewDay!=null?S.viewDay:today,date=dateOf(c,dn),dk=ymd(date),logs=logsFor(c);

function autoPhase(log,isToday,c,dn){
  if(c&&c.fresh&&dn===1&&!stepsDone(log,"morning"))return"evening";
  if(stepsDone(log,"morning")<ML)return isToday&&NOW.getHours()>=19&&stepsDone(log,"evening")>0?"evening":"morning";

}
// Each block is "active" (open), "done" (folded grey summary), "upcoming" (locked) or "skipped" (a new client's first day starts at the Evening)
function blockStates(log,c,dn){
  const m=stepsDone(log,"morning"),e=stepsDone(log,"evening");
  const zero=dn===0;
  const st={};
  st.morning=zero?"hidden":m===ML?"done":"active";
  st.day=zero?"hidden":m<ML?"upcoming":log.day_done?"done":"active";
  st.evening=e===3?"done":(zero||log.day_done||e>0)?"active":"upcoming";
  return st;
}

/* ---------- charts ---------- */
function chart({n,series,max,target,fmt,kind,labelEvery}){
  const W=640,H=190,pl=44,pr=12,pt=12,pb=26,iw=W-pl-pr,ih=H-pt-pb,bw=iw/Math.max(n,1);
  const xc=i=>pl+bw*(i+.5),y=v=>pt+ih-(v/max)*ih;
  const ticks=[0,max/2,max];
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  ticks.forEach(t=>{s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end">${fmt(t)}</text>`});
  for(let i=0;i<n;i++){if(i===0||(i+1)%(labelEvery||7)===0||i===n-1)s+=`<text x="${xc(i)}" y="${H-8}" text-anchor="middle">D${i+1}</text>`}
  if(target!=null)s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(target)}" y2="${y(target)}" stroke="var(--fg)" stroke-dasharray="4 4" stroke-width="1" opacity=".6"/><text x="${W-pr}" y="${y(target)-5}" text-anchor="end" style="fill:var(--fg)">Target</text>`;
  series.forEach(se=>{
    if(kind==="bar"){
      se.values.forEach((v,i)=>{if(v==null)return;const h=Math.max(1,(Math.min(v,max)/max)*ih);s+=`<rect x="${xc(i)-bw*.32}" y="${pt+ih-h}" width="${bw*.64}" height="${h}" rx="3" fill="${target!=null&&v<target?"var(--surface-2)":se.color}" stroke="var(--green-ink)" stroke-width="1"><title>Day ${i+1}: ${fmt(v)}</title></rect>`});
    }else{
      const pts=se.values.map((v,i)=>v==null?null:[xc(i),y(Math.min(v,max))]);
      const segs=[];let cur=[];pts.forEach(p=>{if(p)cur.push(p);else if(cur.length){segs.push(cur);cur=[]}});if(cur.length)segs.push(cur);
      segs.forEach(sg=>{
        if(se.area&&sg.length>1)s+=`<path d="M${sg[0][0]},${pt+ih} L${sg.map(p=>p.join(",")).join(" L")} L${sg[sg.length-1][0]},${pt+ih} Z" fill="${se.color}" opacity=".14"/>`;
        s+=`<polyline points="${sg.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${se.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
      });
      pts.forEach((p,i)=>{if(p)s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4.5:2.5}" fill="${se.color}"><title>Day ${i+1}: ${fmt(se.values[i])}</title></circle>`});
    }
  });
  return s+"</svg>";
}
function heatmap(st,{clickable,sel}={}){
  const cells=[];
  for(let d=1;d<=PROGRAMME_DAYS;d++){
    const row=st.days[d-1],future=d>st.today;
    const cls=`cell ${future?"future":lvl(row?row.pct:0)}${d===st.today?" today":""}${sel===d?" sel":""}`;
    const label=future?`Day ${d}, upcoming`:`Day ${d}, ${row.pct}% done`;
    cells.push(clickable&&!future?`<button class="${cls}" data-hday="${d}" aria-label="${label}" title="${label}">${d}</button>`:`<div class="${cls}" title="${label}">${d}</div>`);
  }
  const start=clientStart(st.c);
  const heads=Array.from({length:7},(_,i)=>addDays(start,i).toLocaleDateString("en-GB",{weekday:"short"}));
  return `<div class="heat-head">${heads.map(h=>`<span>${h}</span>`).join("")}</div><div class="heat">${cells.join("")}</div>
  <div class="legend" style="margin-top:10px"><span><i style="background:var(--lime)"></i>70%+</span><span><i style="background:color-mix(in srgb,var(--lime) 45%,var(--surface))"></i>40 to 69%</span><span><i style="background:color-mix(in srgb,var(--lime) 18%,var(--surface))"></i>Under 40%</span><span><i></i>Nothing logged</span></div>`;
}

function coachView(){
  if(S.coachTab==="settings")return settingsView();
  if(S.detail)return detailView(allClients().find(c=>c.id===S.detail));

}
function overviewView(){
  const all=allClients().map(statsFor);
  const counts={ok:0,warn:0,bad:0};all.forEach(s=>counts[s.status]++);
  const mean=f=>Math.round(all.reduce((a,s)=>a+f(s),0)/all.length);
  const order={bad:0,warn:1,ok:2};
  const keyed={status:s=>order[s.status]*1000+s.avg7,name:s=>s.c.name,day:s=>s.today,today:s=>s.todayRow.sc.pts,pts:s=>s.pts7,avg7:s=>s.avg7,morn:s=>s.morn7,eve:s=>s.eve7,proc:s=>s.proc7??-1,senses:s=>s.senses7,steps:s=>s.steps7||0,last:s=>s.since};
  let rows=all.filter(s=>S.filter==="all"||s.status===S.filter);
  const f=keyed[S.sort.k];rows.sort((a,b)=>{const x=f(a),y=f(b);return(x>y?1:x<y?-1:0)*S.sort.dir});
  const th=(k,l,num)=>`<th class="${num?"num":""}"><button data-sort="${k}" data-active="${S.sort.k===k}">${l}${S.sort.k===k?(S.sort.dir>0?" ↑":" ↓"):""}</button></th>`;
  // breakdowns over everyone's last 7 days
  const rws=[];all.forEach(s=>s.rows.forEach(x=>rws.push(x)));
  const rate=(n,d)=>d?Math.round(n/d*100):0;
  const stepRows=[...MORNING.map(s=>["Morning",s]),...EVENING.map(s=>["Evening",s])].map(([ph,s])=>({label:s.title,ph,p:rate(rws.filter(x=>x.log[s.id]).length,rws.length)}));
  const dayRates=(()=>{let pn=0,pd=0,wk=0,wa=0,wy=0;rws.forEach(x=>{dayPairs(x.log).forEach(q=>{pn++;if(q.done){pd++;if(q.walk)wk++;if(q.water!=null){wa++;if(q.water)wy++}}})});return{meals:rws.length?pd/rws.length:0,walk:pd?Math.round(wk/pd*100):0,water:wa?Math.round(wy/wa*100):0,done:pn?Math.round(pd/pn*100):0}})();
  const kindRows=Object.keys(KINDS).map(k=>{let n=0,d=0,a=0,y=0;rws.forEach(x=>(k==="meal"?mealsOf(x.log):itemsOf(x.log).filter(i=>i.kind===k)).forEach(i=>{n++;if(i.done){d++;if(i.fu!==undefined&&i.fu!==null){a++;if(i.fu)y++}}}));return{k,name:KINDS[k].name,per:rws.length?n/rws.length:0,done:rate(d,n),proc:a?rate(y,a):null}});
  const bar=(p)=>`<div class="bar"><i class="${p<50?"low":p<70?"mid":""}" style="width:${p}%"></i></div>`;
  return `<div class="stack">
    <div class="detail-head"><div><span class="eyebrow">${fmtLong(TODAY)}</span><h1 class="display" style="font-size:clamp(44px,9vw,68px)">Client overview</h1></div></div>
    <div class="tiles">
      <div class="tile"><small>Active clients</small><b class="num">${all.length}</b></div>
      <div class="tile"><small>Avg points, 7 days</small><b class="num">${(all.reduce((a,s)=>a+s.pts7,0)/all.length).toFixed(1)}</b></div>
      <div class="tile"><small>Morning done, 7 days</small><b class="num">${mean(s=>s.morn7)}%</b></div>
      <div class="tile"><small>Evening done, 7 days</small><b class="num">${mean(s=>s.eve7)}%</b></div>
      <div class="tile"><small>Water with meals</small><b class="num">${mean(s=>s.proc7||0)}%</b></div>
      <div class="tile"><small>Need attention</small><b class="num" style="color:${counts.bad?"var(--bad)":"var(--fg)"}">${counts.bad+counts.warn}</b></div>
    </div>
    <div class="coach-grid">
      <div class="stack" style="min-width:0">
        <div class="filters" role="group" aria-label="Filter clients">
          ${[["all",`All ${all.length}`],["bad",`At risk ${counts.bad}`],["warn",`Slipping ${counts.warn}`],["ok",`On track ${counts.ok}`]].map(([k,l])=>`<button class="chip" data-filter="${k}" aria-pressed="${S.filter===k}">${l}</button>`).join("")}
        </div>
        <div class="tbl-wrap"><table>
          <thead><tr>${th("name","Client")}${th("status","Status")}${th("day","Day",1)}${th("today","Points today",1)}${th("pts","Avg pts 7d",1)}${th("avg7","Done 7d",1)}<th>Last 7</th>${th("morn","Morning",1)}${th("eve","Evening",1)}${th("proc","Water",1)}${th("senses","Senses",1)}${th("steps","Steps avg",1)}${th("last","Last log")}</tr></thead>
          <tbody>${rows.map(s=>{const[cls,lab]=STATUS[s.status];const l7=s.days.slice(-8,-1);
            return `<tr data-client="${s.c.id}" tabindex="0">
            <td><strong>${esc(s.c.name)}</strong></td>
            <td><span class="pill ${cls}">${lab}</span></td>
            <td class="num">${s.today}</td>
            <td class="num">${s.todayRow.sc.pts}</td>
            <td class="num"><strong>${s.pts7.toFixed(1)}</strong></td>
            <td class="num">${s.avg7}%</td>
            <td><span class="mini">${Array.from({length:7},(_,i)=>{const x=l7[l7.length-7+i];return `<i class="${x?lvl(x.pct):""}" title="${x?`Day ${x.d}: ${x.sc.pts} pts`:""}"></i>`}).join("")}</span></td>
            <td class="num">${s.morn7}%</td>
            <td class="num">${s.eve7}%</td>
            <td class="num">${s.proc7==null?"–":s.proc7+"%"}</td>
            <td class="num">${s.senses7.toFixed(1)} / 5</td>
            <td class="num">${s.steps7?Math.round(s.steps7).toLocaleString("en-GB"):"–"}</td>
            <td>${s.since===0?"Today":s.since===1?"Yesterday":`<span style="color:var(--bad)">${s.since} days ago</span>`}</td></tr>`}).join("")}</tbody>
        </table></div>
        <p class="muted" style="font-size:12px">1 point per completed step, meal, walk block and non-negotiable. Done 7d is points against everything available. Morning and Evening show how often all 3 steps were done. Water is how often clients had water with their meals. Status: on track at 70%+ done, slipping at 45 to 69%, at risk under 45% or 2+ days with nothing logged.</p>
      </div>
      <section class="card"><div class="sec-head"><h2 class="sec-title" style="font-size:20px">Last 7 days</h2></div>
        <div class="hview" role="group" aria-label="Show"><button class="chip" data-hview="phases" aria-pressed="${S.hview!=="day"}">Morning & Evening</button><button class="chip" data-hview="day" aria-pressed="${S.hview==="day"}">Meals & walks</button></div>
        ${S.hview==="day"
          ?`<p class="muted" style="font-size:12px;margin-bottom:8px">How the Day's non-negotiables are going across all clients.</p>
            <div class="kindrow"><div class="kind-h"><b>Meals logged</b><span class="muted num">${dayRates.meals.toFixed(1)} a day</span></div><div class="habit"><span>Planned meals eaten</span>${bar(dayRates.done)}<span class="num" style="text-align:right">${dayRates.done}%</span></div></div>
            <div class="kindrow"><div class="habit"><span>Walk after meal</span>${bar(dayRates.walk)}<span class="num" style="text-align:right">${dayRates.walk}%</span></div></div>
            <div class="kindrow"><div class="habit"><span>Water with meal</span>${bar(dayRates.water)}<span class="num" style="text-align:right">${dayRates.water}%</span></div></div>`
          :`<p class="muted" style="font-size:12px;margin-bottom:8px">How often each step gets done across all clients.</p>`+stepRows.map(r=>`<div class="habit"><span><span class="pl">${r.ph}</span> ${esc(r.label)}</span>${bar(r.p)}<span class="num" style="text-align:right">${r.p}%</span></div>`).join("")}
      </section>
    </div>
  </div>`;
}
function phaseLog(title,steps,log,wk){
  return `<div class="log-phase"><h4>${title}</h4>${steps.map(s=>{const d=log[s.id];
    const ans=s.asks.map(a=>{if(a.type==="review")return"";const v=a.type==="todo"?todoOf(log).map(t=>t[1]).join(", "):log[a.k];if(v===undefined||v==="")return"";let t=a.type==="rating"?v+"/10":a.type==="choice"?((a.options.find(o=>o[0]===v)||[0,v])[1]):Array.isArray(v)?v.join(", "):a.type==="number"&&a.target?`${Number(v).toLocaleString("en-GB")} of ${Number(wk[a.target]).toLocaleString("en-GB")}`:v;return `<span><span class="muted">${esc(a.label.replace(/\? 1 to 10/,"").replace(/\?$/,""))}:</span> ${esc(t)}</span>`}).filter(Boolean).join("");
    return `<div class="lp-row ${d?"":"miss"}"><div class="lp-top"><span>${d?"✓ ":""}${esc(s.title)}</span><span class="num">${d?esc(d):"–"}</span></div>${ans?`<div class="lp-ans">${ans}</div>`:""}</div>`}).join("")}</div>`;
}
function detailView(c){

  const sel=S.detailDay||Math.max(1,st.today),row=st.days[sel-1],wk=row.wk,log=row.log,items=itemsOf(log);
  const note=(store.get(K.notes,{})[c.id])||{};
  return `<div class="stack">
    <div><button class="chip" data-act="back">&lsaquo; All clients</button></div>
    <div class="detail-head">
      <div><span class="eyebrow">Started ${fmtShort(clientStart(c))} · Day ${st.today} of ${PROGRAMME_DAYS}</span><h1 class="display">${esc(c.name)}</h1>${(()=>{const b=logsFor(c)[ymd(addDays(clientStart(c),-1))]||{};return b.base_steps?`<p class="muted" style="font-size:13px">Baseline: ${Number(b.base_steps).toLocaleString("en-GB")} steps · ${b.base_protein}g protein · ${b.base_water}L water a day</p>`:""})()}</div>
      <span class="pill ${cls}" style="font-size:14px">${lab}</span>
    </div>
    <div class="tiles">
      <div class="tile"><small>Avg points, 7 days</small><b class="num">${st.pts7.toFixed(1)}</b></div>
      <div class="tile"><small>Done, 7 days</small><b class="num">${st.avg7}%</b></div>
      <div class="tile"><small>Morning done</small><b class="num">${st.morn7}%</b></div>
      <div class="tile"><small>Evening done</small><b class="num">${st.eve7}%</b></div>
      <div class="tile"><small>Water with meals</small><b class="num">${st.proc7==null?"–":st.proc7+"%"}</b></div>
    </div>
    <div class="two">
      <section class="card"><div class="sec-head"><h2 class="sec-title" style="font-size:20px">28 day map</h2><span class="muted" style="font-size:12px">Select a day to see its log</span></div>${heatmap(st,{clickable:true,sel})}</section>
      <section class="card"><div class="sec-head"><h2 class="sec-title" style="font-size:20px">Day ${sel} log</h2><span class="muted num">${fmtShort(dateOf(c,sel))} · ${row.sc.pts} pts · ${row.sc.brain.size}/4 brain · ${row.sc.senses.size}/5 senses</span></div>
        <div class="log-phase"><h4>Timeline</h4>${timeline(log)}${log.bank?`<p style="font-size:13px;margin-top:8px"><span class="muted">Banked:</span> “${esc(log.bank)}”</p>`:""}</div>
        <details class="raw"><summary>Full answers by section</summary>
        ${phaseLog("Morning",MORNING,log,wk)}
        <div class="log-phase"><h4>Day: meals & walks</h4>${log.train==="yes"?`<div class="lp-row ${log.train_done?"":"miss"}"><div class="lp-top"><span>${log.train_done?"✓ ":""}Training session${log.train_time?" (planned "+esc(log.train_time)+")":""}</span><span class="num">${log.train_done?esc(log.train_done):"–"}</span></div></div>`:""}${log.energy?`<p class="muted" style="font-size:12px;margin-bottom:6px">Energy ${esc(log.energy)} · ${log.train==="yes"?"training day":"rest day"}</p>`:""}
          ${dayPairs(log).length?dayPairs(log).map(q=>`<div class="lp-row ${q.done?"":"miss"}"><div class="lp-top"><span>${q.done?"✓ ":""}Meal ${q.slot}${q.text?": "+esc(q.text):""}</span><span class="num">${q.done?esc(q.done):"–"}${q.done?(q.water===true?' <span class="badge ok">Water</span>':q.water===false?' <span class="badge miss">No water</span>':""):""}</span></div></div><div class="lp-row ${q.walk?"":"miss"}"><div class="lp-top"><span>${q.walk?"✓ ":""}Walk after Meal ${q.slot}</span><span class="num">${q.walk?esc(q.walk):"–"}</span></div></div>`).join(""):`<p class="muted" style="font-size:13px">No meals logged.</p>`}</div>
        ${phaseLog("Evening",eveningSteps(log),log,wk)}</details>
      </section>
    </div>
    ${trendCharts(st)}
    <section class="card stack" style="gap:10px"><div class="sec-head"><h2 class="sec-title" style="font-size:20px">Note to ${esc(c.name.split(" ")[0])}</h2>${note.at?`<span class="muted" style="font-size:12px">Last sent ${fmtShort(new Date(note.at))}</span>`:""}</div>
      <label for="coachNote" class="muted" style="font-size:13px">Shows at the top of their Today screen.</label>
      <textarea class="input" id="coachNote" placeholder="Great week. Your evening steps are the one to tighten up next.">${esc(note.text||"")}</textarea>
      <div><button class="btn primary" data-act="send-note" data-c="${c.id}">Send note</button></div>
    </section>
  </div>`;
}
function settingsView(){
  return `<div class="stack">
    <div><span class="eyebrow">Coach only</span><h1 class="display" style="font-size:clamp(44px,9vw,68px)">Number setter</h1>
    <p class="muted" style="max-width:62ch;margin-top:6px">Set each week's targets, theme and sticky note. Clients log against these in their Evening. Wake times aren't set here because clients log them anyway.</p></div>
    <div class="tbl-wrap weeks-tbl"><table>
      <thead><tr><th>Week</th><th>Week start</th><th>Steps</th><th>Water (L)</th><th>Protein (g)</th><th>Theme</th><th>Sticky note</th></tr></thead>
      <tbody>${WEEKS.map((w,i)=>`<tr style="cursor:default">
        <td><strong>Week ${i+1}</strong></td><td class="num">${fmtShort(addDays(COHORT,i*7))}</td>
        <td><input class="input" type="number" step="500" min="0" id="w${i}-steps" data-w="${i}" data-f="steps" value="${w.steps}" style="width:100px"></td>

        <td><input class="input" id="w${i}-theme" data-w="${i}" data-f="theme" value="${esc(w.theme)}" style="width:190px"></td>
        <td style="white-space:normal"><textarea class="input" id="w${i}-note" data-w="${i}" data-f="note" style="width:280px;min-height:70px">${esc(w.note)}</textarea></td></tr>`).join("")}</tbody>
