/* ---------- handlers ---------- */
function edit(k,v){const x=curCtx();saveEdit(x.c.id,x.dk,k,v)}
function setMeals(fn){const x=curCtx();const meals=mealsOf(x.log).map(i=>({...i}));saveEdit(x.c.id,x.dk,"meals",fn(meals)||meals)}
function setItems(fn){const x=curCtx();const items=itemsOf(x.log).map(i=>({...i}));saveEdit(x.c.id,x.dk,"items",fn(items)||items)}
function login(role,cid){S.session=role==="coach"?{role}:{role,clientId:cid||"sarah"};store.set(K.session,S.session);S.tab="today";S.coachTab="overview";S.detail=null;S.viewDay=null;S.phase=null;render();window.scrollTo(0,0)}

root.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="loginForm")return login("client");
  if(e.target.id==="ownForm"){const inp=root.querySelector("#ownTask"),v=inp.value.trim();if(!v)return;setItems(a=>[...a,{id:uid(),kind:"own",label:v}]);render();const n=root.querySelector("#ownTask");if(n)n.focus()}
});
root.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-client]");if(!b)return;
  for(const t in timers)clearTimeout(timers[t]); // a tap means typing is finished; its value was saved on change
  const act=b.dataset.act;
  if(act==="demo-client")return login("client");
  if(act==="demo-new"){const f=store.get(K.fresh,null);const nm=(root.querySelector("#email")||{}).value;store.set(K.fresh,{start:ymd(TODAY),offset:0,name:(nm&&nm.split("@")[0]?nm.split("@")[0].replace(/[._-]+/g," ").replace(/\b\w/g,x=>x.toUpperCase()):"New Client")});if(f){const all=store.get(K.edits,{});delete all["new"];store.set(K.edits,all)}return login("client","new")}
  if(act==="demo-reset"){try{Object.values(K).forEach(k=>localStorage.removeItem(k))}catch(e){}for(const k in GEN)delete GEN[k];WEEKS=DEFAULT_WEEKS.map(w=>({...w}));S.session=null;toast("Demo data cleared");return render()}
  if(act==="nextday"){const f=store.get(K.fresh,null);if(!f)return;f.offset=(f.offset||0)+1;store.set(K.fresh,f);S.viewDay=null;S.phase=null;S.open={};render();window.scrollTo(0,0);toast("Moved to tomorrow");return}
  if(act==="demo-coach")return login("coach");
  if(act==="logout"){S.session=null;store.set(K.session,null);return render()}
  if(b.dataset.pillar){S.tab="programme";S.openPillar=b.dataset.pillar;render();return}
  if(b.dataset.tab){if(S.session.role==="coach"){S.coachTab=b.dataset.tab;S.detail=null}else{S.tab=b.dataset.tab}render();window.scrollTo(0,0);return}
  if(b.dataset.phase||b.dataset.jump){const id=b.dataset.phase||b.dataset.jump;S.scrollTo=id==="score"?"score":id;render();return}
  if(b.dataset.open){S.open[b.dataset.open]=true;S.scrollTo=b.dataset.open;return render()}
  if(b.dataset.collapse){S.open[b.dataset.collapse]=false;S.scrollTo=b.dataset.collapse;return render()}
  if(b.dataset.finishday){edit("day_done",nowHHMM());S.open.day=false;S.scrollTo="evening";toast("Day finished "+nowHHMM());return render()}
  if(b.dataset.unfinishday){edit("day_done","");S.open.day=true;return render()}
  if(act==="day"){const c=me(),t=clientDayNum(c),d=Number(b.dataset.d);S.viewDay=d===t?null:clamp(d,c.fresh?0:1,t);S.phase=null;S.open={};return render()}
  if(b.dataset.client){S.detail=b.dataset.client;S.detailDay=null;render();window.scrollTo(0,0);return}
  if(act==="back"){S.detail=null;return render()}
  if(b.dataset.hday){S.detailDay=Number(b.dataset.hday);return render()}
  if(b.dataset.filter){S.filter=b.dataset.filter;return render()}
  if(b.dataset.hview){S.hview=b.dataset.hview;return render()}
  if(b.dataset.sort){const k=b.dataset.sort;S.sort=S.sort.k===k?{k,dir:-S.sort.dir}:{k,dir:k==="name"||k==="status"||k==="last"?1:-1};return render()}
  if(act==="send-note"){const v=root.querySelector("#coachNote").value.trim();const all=store.get(K.notes,{});all[b.dataset.c]={text:v,at:Date.now()};store.set(K.notes,all);toast(v?"Note sent":"Note cleared");return render()}
  if(act==="save-weeks"){
    root.querySelectorAll("[data-w]").forEach(el=>{const w=WEEKS[el.dataset.w],f=el.dataset.f;w[f]=(f==="water"||f==="steps"||f==="protein")?Number(el.value)||0:el.value});
    store.set(K.weeks,WEEKS);for(const k in GEN)delete GEN[k];toast("Saved");return render();
  }
  if(act==="reset-weeks"){WEEKS=DEFAULT_WEEKS.map(w=>({...w}));store.set(K.weeks,null);for(const k in GEN)delete GEN[k];toast("Defaults restored");return render()}
  // client: phase steps
  if(b.dataset.step){const id=b.dataset.step,t=nowHHMM();edit(id,t);toast("Logged "+t);
    if(id==="mm"){const yes=curCtx().log.meal1_water==="yes";setMeals(a=>a.map(m=>m.slot===1?{...m,done:t,fu:yes}:m));if(yes){const w=Number(curCtx().log.water)||0;edit("water",Math.round((w+0.5)*10)/10)}}
    if(id===MORNING[MORNING.length-1].id){S.open.morning=false;S.scrollTo="day"}if(id==="e3"){S.open.evening=false;S.scrollTo="score"}return render()}
  if(b.dataset.undo){edit(b.dataset.undo,"");if(b.dataset.undo==="mm")setMeals(a=>a.map(m=>m.slot===1?{...m,done:"",fu:null}:m));return render()}
  if(b.dataset.ask){const k=b.dataset.ask,raw=b.dataset.val,v=b.dataset.num?Number(raw):raw,cur=curCtx().log[k];edit(k,cur===v?"":v);return render()}
  // client: day list
  if(b.dataset.cat){S.cat=b.dataset.cat;return render()}
  if(b.dataset.add){const label=b.dataset.label;if(itemsOf(curCtx().log).some(i=>i.label===label)&&b.dataset.add!=="own"){toast("Already on your list");return}setItems(a=>[...a,{id:uid(),kind:b.dataset.add,label}]);toast("Added to your list");return render()}
  if(b.dataset.del){setItems(a=>a.filter(i=>i.id!==b.dataset.del));return render()}
  if(b.dataset.tick){const id=b.dataset.tick;setItems(a=>a.map(i=>i.id!==id?i:(i.done?{...i,done:"",fu:null}:{...i,done:nowHHMM(),fu:null})));return render()}
  if(b.dataset.carry){const x=curCtx(),it=itemsOf(x.log).find(i=>i.id===b.dataset.carry);if(!it)return;const list=todoOf(x.log);edit("todo_tmr",list.some(t=>t[1]===it.label)?list.filter(t=>t[1]!==it.label):[...list,[it.kind,it.label]]);return render()}
  if(b.dataset.tdel){const list=todoOf(curCtx().log).slice();list.splice(Number(b.dataset.tdel),1);edit("todo_tmr",list);return render()}
  if(b.dataset.tadd){const inp=root.querySelector("#tmrInput"),v=inp&&inp.value.trim();if(!v)return;edit("todo_tmr",[...todoOf(curCtx().log),["own",v]]);render();const n=root.querySelector("#tmrInput");if(n)n.focus();return}
  if(b.dataset.chk){const sl=b.dataset.chk;root.querySelectorAll(`[id^="a-c${sl}-"]`).forEach(el=>{const k=el.dataset.input;if(k&&el.value!=="")edit(k,Number(el.value))});edit("chk"+sl,nowHHMM());toast("Numbers updated");return render()}
  if(b.dataset.chkundo){edit("chk"+b.dataset.chkundo,"");return render()}
  if(b.dataset.gauges){S.gopen=!S.gopen;return render()}
  if(b.dataset.pickopen){S.openPick=S.openPick===b.dataset.pickopen?null:b.dataset.pickopen;return render()}
  if(b.dataset.pick){const k=b.dataset.pick,o=b.dataset.val,cur=curCtx().log[k],arr=Array.isArray(cur)?cur:(cur?[cur]:[]);edit(k,b.dataset.multi?(arr.includes(o)?arr.filter(z=>z!==o):[...arr,o]):(arr.includes(o)?[]:[o]));return render()}
  if(b.dataset.trainstart){edit("train_start",nowHHMM());S.wopen=true;return render()}
  if(b.dataset.wopen){S.wopen=!S.wopen;return render()}
  if(b.dataset.trainafter){edit("tmr_train_after",Number(b.dataset.trainafter));return render()}
  if(b.dataset.traintick){const l=curCtx().log;edit("train_done",l.train_done?"":nowHHMM());if(!l.train_start&&!l.train_done)edit("train_start",nowHHMM());S.wopen=false;return render()}
  if(b.dataset.planclear){const i=Number(b.dataset.planclear),plan=planFoodsOf(curCtx().log);plan[i]={};edit("plan_foods",plan);edit("meals_tmr",plan.filter(f=>foodsCount(f)).map(foodsSummary));return render()}
  if(b.dataset.mpdel){const l=mealPlanOf(curCtx().log).slice();l.splice(Number(b.dataset.mpdel),1);edit("meals_tmr",l);return render()}
  if(b.dataset.mpadd){const inp=root.querySelector("#mpInput"),v=inp&&inp.value.trim();if(!v)return;edit("meals_tmr",[...mealPlanOf(curCtx().log),v]);render();const n=root.querySelector("#mpInput");if(n)n.focus();return}
  if(b.dataset.mpquick){edit("meals_tmr",[...mealPlanOf(curCtx().log),b.dataset.mpquick]);return render()}
  if(b.dataset.tquick){edit("todo_tmr",[...todoOf(curCtx().log),[b.dataset.tquick,b.dataset.label]]);return render()}
  if(b.dataset.mealopen){const k=b.dataset.mealopen;S.openMeal=S.openMeal===k?null:k;if(!S.fcat[k])S.fcat[k]="protein";return render()}
  if(b.dataset.fcat){S.fcat[b.dataset.fcat]=b.dataset.val;return render()}
  if(b.dataset.food){const k=b.dataset.food,c=b.dataset.fc,o=b.dataset.val;const tog=f=>{f={...(f||{})};const a=f[c]||[];f[c]=a.includes(o)?a.filter(z=>z!==o):[...a,o];return f};
    if(k.startsWith("plan")){const i=Number(k.slice(4)),plan=planFoodsOf(curCtx().log);plan[i]=tog(plan[i]);edit("plan_foods",plan);edit("meals_tmr",plan.filter(f=>foodsCount(f)).map(foodsSummary));return render()}
    if(k==="m1"){const f=tog(curCtx().log.meal1_foods);edit("meal1_foods",f);edit("meal1",foodsSummary(f))}else setMeals(a=>a.map(m=>{if(m.id!==k)return m;const f=tog(m.foods);return{...m,foods:f,text:foodsSummary(f)||m.text}}));return render()}
  if(b.dataset.mealtick){const id=b.dataset.mealtick,inp=root.querySelector("#mt-"+id);S.openMeal=null;setMeals(a=>a.map(m=>m.id!==id?m:(m.done?{...m,done:"",fu:null,walk:""}:{...m,text:inp?inp.value:m.text,done:nowHHMM(),fu:null})));return render()}
  if(b.dataset.water){const id=b.dataset.water,v=b.dataset.val==="1";if(v){const w=Number(curCtx().log.water)||0;edit("water",Math.round((w+0.5)*10)/10);toast("+500ml water")}if(id==="m1")edit("meal1_water",v);else setMeals(a=>a.map(m=>m.id===id?{...m,fu:v}:m));return render()}
  if(b.dataset.walktick){const id=b.dataset.walktick;if(id==="m1"){edit("meal1_walk",curCtx().log.meal1_walk?"":nowHHMM())}else setMeals(a=>a.map(m=>m.id===id?{...m,walk:m.walk?"":nowHHMM()}:m));return render()}
  if(b.dataset.madd){let nid;setMeals(a=>{nid=uid();return[...a,{id:nid,slot:Math.max(0,...a.map(m=>m.slot))+1,text:""}]});S.openMeal=nid;S.fcat[nid]="protein";return render()}
  if(b.dataset.mdel){setMeals(a=>a.filter(m=>m.id!==b.dataset.mdel).map((m,i)=>({...m,slot:i+2})));return render()}
  if(b.dataset.mlog){const id=b.dataset.mlog,inp=root.querySelector("#mt-"+id);setMeals(a=>a.map(m=>m.id===id?{...m,text:inp?inp.value:m.text,done:nowHHMM(),fu:null}:m));toast("Logged "+nowHHMM());return render()}
  if(b.dataset.munlog){setMeals(a=>a.map(m=>m.id===b.dataset.munlog?{...m,done:"",fu:null}:m));return render()}
  if(b.dataset.mtag){const id=b.dataset.mtag,o=b.dataset.val;setMeals(a=>a.map(m=>{if(m.id!==id)return m;const t=Array.isArray(m.tags)?m.tags:[];return{...m,tags:t.includes(o)?t.filter(z=>z!==o):[...t,o]}}));return render()}
  if(b.dataset.mfu){const id=b.dataset.mfu,v=b.dataset.val==="1";setMeals(a=>a.map(m=>m.id===id?{...m,fu:v}:m));return render()}
  if(b.dataset.mfeel){const id=b.dataset.mfeel,o=b.dataset.val;setMeals(a=>a.map(m=>{if(m.id!==id)return m;const t=Array.isArray(m.feel)?m.feel:[];return{...m,feel:t.includes(o)?t.filter(z=>z!==o):[...t,o]}}));return render()}
  if(b.dataset.askm){const k=b.dataset.askm,o=b.dataset.val,cur=curCtx().log[k],arr=Array.isArray(cur)?cur:[];edit(k,arr.includes(o)?arr.filter(z=>z!==o):[...arr,o]);return render()}
  if(b.dataset.sfeel){const k=b.dataset.sfeel+"_feel",o=b.dataset.val,cur=curCtx().log[k],arr=Array.isArray(cur)?cur:[];edit(k,arr.includes(o)?arr.filter(z=>z!==o):[...arr,o]);return render()}
  if(b.dataset.ifeel){const id=b.dataset.ifeel,o=b.dataset.val;setItems(a=>a.map(i=>{if(i.id!==id)return i;const arr=Array.isArray(i.feel)?i.feel:[];return{...i,feel:arr.includes(o)?arr.filter(z=>z!==o):[...arr,o]}}));return render()}
  if(b.dataset.fu){const id=b.dataset.fu,v=b.dataset.val==="1";setItems(a=>a.map(i=>i.id===id?{...i,fu:v}:i));return render()}
});
root.addEventListener("keydown",e=>{if(e.target.id==="mpInput"&&e.key==="Enter"){e.preventDefault();const bt=root.querySelector("[data-mpadd]");if(bt)bt.click();return}if(e.target.id==="tmrInput"&&e.key==="Enter"){e.preventDefault();const bt=root.querySelector("[data-tadd]");if(bt)bt.click();return}const tr=e.target.closest("tr[data-client]");if(tr&&(e.key==="Enter"||e.key===" ")){e.preventDefault();tr.click()}});
let timers={};
root.addEventListener("input",e=>{
  const mt=e.target.dataset.mtext||e.target.dataset.mnote;if(mt){const f=e.target.dataset.mtext?"text":"note",v=e.target.value;clearTimeout(timers["m"+mt+f]);timers["m"+mt+f]=setTimeout(()=>setMeals(a=>a.map(m=>m.id===mt?{...m,[f]:v}:m)),300);return}
  const inote=e.target.dataset.inote;if(inote){const v=e.target.value;clearTimeout(timers["i"+inote]);timers["i"+inote]=setTimeout(()=>setItems(a=>a.map(i=>i.id===inote?{...i,note:v}:i)),300);return}
  const k=e.target.dataset.input;if(!k)return;
  let v=e.target.value;if(e.target.type==="number")v=v===""?"":Number(v);
  clearTimeout(timers[k]);timers[k]=setTimeout(()=>edit(k,v),300);
});
root.addEventListener("change",e=>{
  const fk=e.target.dataset.file;if(fk){const f=e.target.files&&e.target.files[0];if(f){edit(fk,f.name);render()}return}
  const k=e.target.dataset.input;if(!k)return;
  let v=e.target.value;if(e.target.type==="number")v=v===""?"":Number(v);
  if(k==="tmr_train_time")edit("tmr_train_after","");
  clearTimeout(timers[k]);edit(k,v);if(e.target.type==="number"||e.target.tagName==="SELECT"||k==="tmr_train_time"||k==="tmr_wake")render();
});

render();
})();

</script>

</body>
</html>
